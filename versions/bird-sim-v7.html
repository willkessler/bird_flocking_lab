<meta charset="utf-8">
<title>Bird Flight Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0b0f14; --panel:#121821e6; --panel2:#0e131a; --line:#223042;
    --ink:#dfe8f2; --dim:#8ea0b5; --accent:#4bd6c9; --accent2:#ffb454;
    --good:#5ad19a; --bad:#ff6b6b; --warn:#ffd166; --lift:#4bd6c9; --thrust:#ffb454; --drag:#ff6b6b; --weight:#9aa7ff;
    --ui:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #scene{position:absolute;inset:0}
  /* Panels */
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 10px 40px #0008}
  #controls{top:12px;left:12px;width:326px;max-height:calc(100% - 24px);overflow-y:auto;padding:0}
  #controls::-webkit-scrollbar{width:9px}
  #controls::-webkit-scrollbar-thumb{background:#2a3a4f;border-radius:8px}
  #hud{top:12px;right:12px;width:270px;padding:12px 14px}
  #charts{right:12px;bottom:12px;width:270px;padding:10px 12px}
  #toolbar{bottom:12px;left:12px;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 320px)}
  h1{font-size:14px;margin:0;padding:13px 14px 11px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  h1 small{color:var(--dim);font-weight:400;font-size:11px;margin-left:auto}
  details{border-bottom:1px solid var(--line)}
  details[open] > summary{color:var(--ink)}
  summary{cursor:pointer;list-style:none;padding:9px 14px;font-weight:600;color:var(--dim);user-select:none;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;font-size:11px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--accent);font-size:10px;transition:transform .15s}
  details[open] > summary::before{transform:rotate(90deg)}
  .sec{padding:4px 14px 12px}
  .ctl{margin:9px 0}
  .ctl label{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:3px;font-size:11.5px}
  .ctl label b{color:var(--ink);font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#243244;border-radius:3px;outline:none;margin:2px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px #4bd6c933}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
  select{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{flex:1;text-align:center;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--dim);cursor:pointer;font-weight:600;font-size:11.5px;transition:.12s}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip.on{background:linear-gradient(180deg,#183a3a,#12232a);border-color:var(--accent);color:var(--accent)}
  .btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);cursor:pointer;font-weight:600;font-size:12px;transition:.12s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(180deg,#1c4b47,#123230);border-color:var(--accent);color:var(--accent)}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--dim);cursor:pointer;font-size:11.5px;padding:3px 0}
  .toggle input{accent-color:var(--accent)}
  /* HUD */
  .hud-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:4px}
  .stat{display:flex;flex-direction:column}
  .stat .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:18px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.15}
  .stat .u{color:var(--dim);font-size:10px;font-weight:400}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bar{display:flex;align-items:center;gap:8px;font-size:11px}
  .bar .lab{width:52px;color:var(--dim)}
  .bar .track{flex:1;height:8px;background:#1a2432;border-radius:5px;overflow:hidden;position:relative}
  .bar .fill{position:absolute;top:0;bottom:0;left:50%;border-radius:5px}
  .bar .val{width:56px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .hint{color:var(--dim);font-size:10.5px;margin-top:9px;line-height:1.35}
  .badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;margin-left:6px}
  .badge.ok{background:#123a2c;color:var(--good)}
  .badge.stall{background:#3a1212;color:var(--bad)}
  .badge.flap{background:#1c3a38;color:var(--accent)}
  .badge.coast{background:#20293f;color:#9aa7ff}
  #chartCanvas{width:100%;height:150px;display:block}
  .clab{display:flex;gap:12px;font-size:10px;color:var(--dim);margin-top:4px;flex-wrap:wrap}
  .clab i{width:9px;height:3px;display:inline-block;border-radius:2px;margin-right:4px;vertical-align:middle}
  .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;color:var(--dim);font-size:10.5px;background:#0b0f14aa;padding:4px 10px;border-radius:16px;border:1px solid var(--line)}
  .flash{color:var(--warn)}
  a{color:var(--accent)}
</style>

<div id="app">
  <div id="scene"></div>

  <div class="panel" id="controls">
    <h1><span class="dot"></span> Bird Flight Lab <small>blade-element</small></h1>
    <!-- sections injected here -->
    <div id="secHost"></div>
  </div>

  <div class="panel" id="hud">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:700">Flight state <span id="modeBadge" class="badge">FLAP</span><span id="stallBadge" class="badge ok">OK</span></div>
    </div>
    <div class="hud-grid" id="statGrid"></div>
    <div class="bars" id="forceBars"></div>
    <div class="hint" id="hudHint"></div>
  </div>

  <div class="panel" id="charts">
    <div style="font-weight:700;margin-bottom:4px">Forces over time</div>
    <canvas id="chartCanvas"></canvas>
    <div class="clab">
      <span><i style="background:var(--lift)"></i>Lift</span>
      <span><i style="background:var(--thrust)"></i>Net thrust</span>
      <span><i style="background:var(--weight)"></i>Weight</span>
      <span><i style="background:#7fd1ff"></i>Altitude</span>
    </div>
  </div>

  <div class="panel" id="toolbar">
    <button class="btn primary" id="btnPlay">⏸ Pause</button>
    <button class="btn" id="btnReset">↺ Restart flight</button>
    <button class="btn" id="btnResetAll">⟲ Reset controls</button>
    <button class="btn" id="btnFollow">🎥 Follow: on</button>
    <span style="color:var(--dim);font-size:11px">drag to orbit · scroll to zoom · <b style="color:var(--ink)">1–9</b> ride a bird · <b style="color:var(--ink)">0</b> orbit</span>
  </div>

  <div class="tag">Bird flies +X along the shore. <span id="skimTag"></span>Wind, mass, wings, muscles & stabilizers are all live — retune and watch the physics respond.</div>

  <!-- bird's-eye view overlays -->
  <div id="leadTint" style="position:fixed;inset:0;pointer-events:none;z-index:4;display:none;
       box-shadow:inset 0 0 260px 50px rgba(70,150,255,0.30);
       background:radial-gradient(ellipse at center, rgba(80,160,255,0) 42%, rgba(70,150,255,0.18) 100%)"></div>
  <div id="povTag" style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:none;
       pointer-events:none;background:#0b0f14dd;border:1px solid var(--line);border-radius:16px;
       padding:6px 14px;font-size:12px;color:var(--ink);white-space:nowrap"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   BIRD FLIGHT LAB
   A blade-element (strip-theory) flapping-flight simulator.

   Core idea: each wing is divided into spanwise strips. Every strip computes
   its own local relative airflow (bird motion + body rotation + flapping
   velocity + wind), its angle of attack, and its lift & drag. Because the
   downstroke plunges the wing DOWN, the local airflow arrives from below-and-
   front, which tilts each strip's LIFT vector FORWARD -> that forward
   component is THRUST. Thrust therefore EMERGES from the geometry of wing
   motion; it is not scripted. Feathering (wing twist per stroke phase) breaks
   the up/down symmetry so the cycle nets positive thrust. Set feathering to 0
   and thrust collapses -- exactly the classic failure mode.
   ============================================================================ */

const DEG = Math.PI/180, RAD = 180/Math.PI, G = 9.81;
const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);

/* ------------------------------------------------------------------ PARAMS */
const P = {
  // mass & skeleton
  mass:3.5, boneThickness:0.8, wingMassFrac:0.16, headMassFrac:0.12, tailMassFrac:0.095,
  neckLen:0.49, tailLen:0.42,
  // head/bill shape & neck posture (default = pelican): big head, long deep orange bill, neck folded
  // back onto the shoulders in flight. neckFold 0 = extended heron neck, 1 = fully retracted.
  headScale:1.3, beakScale:2.4, neckFold:0.85, beakHex:0xE8A63D,
  // wing geometry (per wing)
  span:1.10, rootChord:0.34, taper:0.5, sweep:6, dihedral:6,
  innerFrac:0.42,          // fraction of half-span that is the inner (arm) segment
  innerAoA:8, outerAoA:3,  // geometric angle of attack of inner vs outer (hand) wing
  tipSpread:0.15,          // wingtip primary-feather splay (winglet at low values, airbrake high)
  // stabilizers
  tailArea:0.070, tailIncidence:-3, angDamp:1.0, stab:0.9, trimPitch:2,
  // aero
  rho:1.225, clAlpha:5.8, stallDeg:15, cd0:0.016, inducedK:0.035,
  groundEffect:1, geStrength:1.3, bodyCd:0.38,
  // flapping / kinematics
  mode:'muscle', flapFreq:2.6, flapAmp:35, upDownAsym:0.18, featherAmp:8,
  foldAmount:0.85, maxFoldDeg:95,   // wrist/elbow flex on the upstroke (0 = rigid wing)
  // flap/coast strategy (intermittent flight)
  flapStrategy:'intermittent', paceSpeed:11, followDist:2.5, draftBand:3, coastBeta:10,
  // flock: V-formation, wingtip wakes, drafting, lead rotation
  nBirds:8, slotDx:2.2, slotDz:3.4, draft:1, draftStrength:5.0, wakeRange:30, wakeDecay:22, wakeCore:0.35,
  // reduced-drag slipstream ("rubber band"): a bird sitting in the wake ahead flies in co-moving
  // air, so its drag drops and a leader's surge is transmitted down the line as a wave.
  draftPull:4.2, slipWidth:2.2, slipDecay:7,
  leadRotate:1, rotatePeriod:16, showWakes:1,
  // muscle (dynamic mode)
  muscleStrength:1.8, momentArm:0.020, muscleOptBeta:-8, muscleWidth:60,
  vmax:30, elevatorFrac:0.3,
  // wind
  headwind:1.5, crosswind:-0.5, updraft:0, turbulence:2.5,
  // viz: wind vector field
  vWind:1,
  // shoreline & surface skimming (ground-effect hydroplaning led by the lead bird)
  skimEnable:1, skimAlt:2.0, skimPeriod:30, skimDuration:8,
  // launch
  launchSpeed:13, launchAngle:0, startAlt:20,
  // sim
  timeScale:1.0,
  // viz toggles
  vForces:0, vFlow:1, vTrail:0
};

/* ------------------------------------------------------------------ PRESETS */
const PRESETS = {
  Swallow:{ mass:0.020, span:0.16, rootChord:0.045, taper:0.45, sweep:16, dihedral:4,
    innerFrac:0.38, innerAoA:9, outerAoA:4, foldAmount:0.8, maxFoldDeg:80,
    flapFreq:8.5, flapAmp:48, featherAmp:14, tailArea:0.006, tailLen:0.11,
    neckLen:0.06, launchSpeed:9, startAlt:12, paceSpeed:13, wingMassFrac:0.12, headMassFrac:0.10,
    headScale:0.9, beakScale:0.7, neckFold:0.1, beakHex:0x2b2b2b },
  Crow:{ mass:0.50, span:0.45, rootChord:0.13, taper:0.6, sweep:8, dihedral:5,
    innerFrac:0.42, innerAoA:8, outerAoA:3, foldAmount:0.75, maxFoldDeg:75,
    flapFreq:4.2, flapAmp:40, featherAmp:10, tailArea:0.024, tailLen:0.24,
    neckLen:0.14, launchSpeed:11, startAlt:14, paceSpeed:14, wingMassFrac:0.15, headMassFrac:0.11,
    headScale:1.0, beakScale:0.9, neckFold:0.15, beakHex:0x1e1e1e },
  Albatross:{ mass:9.0, span:1.62, rootChord:0.24, taper:0.42, sweep:3, dihedral:3,
    innerFrac:0.50, innerAoA:7, outerAoA:3, foldAmount:0.4, maxFoldDeg:55,
    flapFreq:2.4, flapAmp:34, featherAmp:5, tailArea:0.055, tailLen:0.40,
    neckLen:0.24, launchSpeed:17, startAlt:30, paceSpeed:19, wingMassFrac:0.14, headMassFrac:0.12,
    headScale:1.1, beakScale:1.5, neckFold:0.25, beakHex:0xE9C27A },
  Pelican:{ mass:3.5, span:1.10, rootChord:0.34, taper:0.5, sweep:6, dihedral:6,
    innerFrac:0.42, innerAoA:8, outerAoA:3, foldAmount:0.85, maxFoldDeg:95,
    flapFreq:2.6, flapAmp:35, featherAmp:8, tailArea:0.070, tailLen:0.42,
    neckLen:0.35, launchSpeed:13, startAlt:25, paceSpeed:15, wingMassFrac:0.16, headMassFrac:0.12,
    headScale:1.3, beakScale:2.4, neckFold:0.85, beakHex:0xE8A63D }
};
let currentPreset = 'Pelican';
const DEFAULTS = JSON.parse(JSON.stringify(P));   // snapshot for "reset all controls"

/* ------------------------------------------------------------------ SCENE */
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc7e8);
scene.fog = new THREE.Fog(0x9fc7e8, 90, 470);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.05, 2000);

// lights
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x24405a, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.05);
sun.position.set(40,70,30); scene.add(sun);

// coastline constants (shared by the ocean clip and the terrain)
const COAST_Z=42, TERR_PERIOD=360, Z_NEAR=14, Z_FAR=260;

// ----- ocean: a big plane displaced by a GPU wave field, keyed to WORLD x/z so it can recenter on
// the flock every frame while the swell stays put (the motion cue when the flock drops to skim).
// FLAT-SHADED: the normal is the per-facet geometric normal (screen-space derivative of world pos),
// so the surface reads as faceted low-poly swell, not smooth plastic. It is CLIPPED at the coastline
// so the sea never overlaps the sand (that overlap was the flicker).
const waterGeo = new THREE.PlaneGeometry(1500,1500,150,150);
const waterMat = new THREE.ShaderMaterial({
  transparent:true,
  extensions:{ derivatives:true },
  uniforms:{ uTime:{value:0}, uSun:{value:new THREE.Vector3(40,70,30).normalize()}, uCoast:{value:COAST_Z} },
  vertexShader:`
    uniform float uTime; varying vec3 vW;
    float wv(vec2 p){ float h=0.0;
      h+=sin(p.x*0.19+uTime*1.05)*0.26; h+=sin(p.y*0.16-uTime*0.85)*0.22;
      h+=sin((p.x*0.11+p.y*0.14)+uTime*1.5)*0.15; h+=sin((p.x*0.37-p.y*0.31)+uTime*2.2)*0.06;
      return h; }
    void main(){
      vec4 wp=modelMatrix*vec4(position,1.0);
      vec3 dp=position; dp.z+=wv(wp.xz);               // local +z -> world +y after the -90 x-rotation
      vec4 wp2=modelMatrix*vec4(dp,1.0); vW=wp2.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp2;
    }`,
  fragmentShader:`
    uniform vec3 uSun; uniform float uCoast; varying vec3 vW;
    // wandering coastline — MUST match JS coastLine() so sea and land meet exactly (coves & points)
    float cl(float x){ float K=0.0174532925;
      return 10.0*sin(K*x+0.6)+4.0*sin(2.0*K*x+2.1)+2.5*sin(4.0*K*x+0.4)+1.5*sin(7.0*K*x+3.0); }
    void main(){
      if(vW.z > uCoast + cl(vW.x) + 1.0) discard;            // stop the sea at the wandering coastline
      vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));          // FLAT per-facet normal
      if(n.y<0.0) n=-n;
      float dif=clamp(dot(n,uSun),0.0,1.0);
      vec3 deep=vec3(0.06,0.26,0.40), shallow=vec3(0.16,0.48,0.60);
      vec3 col=mix(deep,shallow, clamp(n.y*1.6-0.55,0.0,1.0));   // facets tilted off-vertical read lighter
      col*=0.72+0.5*dif;
      gl_FragColor=vec4(col,0.96);
    }`
});
waterMat.depthWrite = false;   // so faceted wave crests never occlude the bird shadows drawn over the sea
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2; water.position.y = 0; water.renderOrder=-2; scene.add(water);

// ----- shoreline: a real noise HEIGHTFIELD (the approach from Will's threejs-world) instead of a
// flat wall -- underwater slope -> beach -> foothills -> snow-capped peaks, flat-shaded and coloured
// by elevation. The height field is PERIODIC in x (period TERR_PERIOD), so the group can snap by
// whole periods as the flock flies and the coast is seamless & endless with no per-frame rebuild.
const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
const _tk = 2*Math.PI/TERR_PERIOD;
// The waterline is NOT straight: it wanders in z with coves (cut inland) and points/outcrops (jut
// seaward). All terms are integer harmonics of _tk so the whole coast stays periodic (seamless tile).
// This exact function is mirrored in the water shader's cl() so sea and land share one coastline.
function coastLine(x){
  return 10*Math.sin(_tk*x+0.6) + 4*Math.sin(2*_tk*x+2.1) + 2.5*Math.sin(4*_tk*x+0.4) + 1.5*Math.sin(7*_tk*x+3.0);
}
// the flock's z centre-line: it roughly parallels the coast (follows the dominant cove/point curve,
// scaled a bit, so it always sits safely seaward of the shifting shore) -- birds working the surf line.
function coastFollow(x){ return 0.85*10*Math.sin(_tk*x+0.6); }
function terrainH(x,z){
  const inland = z - COAST_Z - coastLine(x);            // shore position shifts with x -> coves & points
  const base = inland<0 ? inland*0.30 : (0.15*inland + 0.0018*inland*inland);   // cross-shore profile
  const amp  = clamp((inland-10)/50, 0, 1) * 20;                                // smooth beach, jagged peaks
  // every x term is an integer harmonic of _tk => exactly periodic in x (seamless tiling)
  const n = Math.sin(_tk*x + z*0.04 + 0.3)*1.0
          + Math.sin(2*_tk*x + z*0.02 + 1.7)*0.5
          + Math.sin(3*_tk*x + 3.1)*0.33
          + Math.sin(5*_tk*x + z*0.03 + 0.6)*0.2
          + Math.sin(8*_tk*x + 2.2)*0.12
          + Math.sin(13*_tk*x + 5.0)*0.07;
  return base + amp*n*0.5;
}
const _tc=new THREE.Color();
function terrainColor(h){
  if(h<1.2)      _tc.setHex(0xcdbe97);   // sand
  else if(h<9)   _tc.setHex(0x5f7f4c);   // grass
  else if(h<26)  _tc.setHex(0x6a6459);   // rock
  else if(h<48)  _tc.setHex(0x585550);   // dark rock
  else           _tc.setHex(0xe9eef3);   // snow
  return _tc;
}
function buildTerrain(){
  while(terrainGroup.children.length){ const c=terrainGroup.children.pop(); c.geometry&&c.geometry.dispose(); }
  const X0=-2*TERR_PERIOD, X1=2*TERR_PERIOD, dx=10, dz=6;
  const P=[], C=[];
  const vert=(x,z)=>{ const h=terrainH(x,z); P.push(x,h,z);
    const c=terrainColor(h + (Math.random()*1.6-0.8)); C.push(c.r,c.g,c.b); };   // jitter the band edges
  for(let x=X0;x<X1;x+=dx){
    for(let z=Z_NEAR;z<Z_FAR;z+=dz){
      vert(x,z); vert(x,z+dz); vert(x+dx,z+dz);      // two CCW tris per cell (normal up)
      vert(x,z); vert(x+dx,z+dz); vert(x+dx,z);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  const m=new THREE.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:1.0, side:THREE.DoubleSide});
  terrainGroup.add(new THREE.Mesh(g,m));
  // jetties: a few weathered timber groynes reaching out from the shore into the surf. One per tile
  // period (at a fixed local offset) so they repeat seamlessly with the terrain snap.
  const jettyMat=new THREE.MeshStandardMaterial({color:0x4b4132, roughness:1.0});
  for(let x=X0; x<X1; x+=TERR_PERIOD){

function tri(a,b,c){ return [a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z]; }

// Build one wing segment spanning global span-fractions gf0..gf1. Local +z*sign starts
// at 0 (so an outer segment can be attached at the elbow joint). Chord & sweep follow
// the global planform so inner + outer read as one continuous wing when extended.
function buildWingSeg(sign, gf0, gf1){
  const n=5, verts=[];
  const push=(p)=>verts.push(p.x,p.y,p.z);
  for(let i=0;i<n;i++){
    const a=i/n, b=(i+1)/n;
    const gfa=lerp(gf0,gf1,a), gfb=lerp(gf0,gf1,b);
    const la=(gfa-gf0)*P.span, lb=(gfb-gf0)*P.span;   // local span position from segment root
    const ca=P.rootChord*(1-(1-P.taper)*gfa), cb=P.rootChord*(1-(1-P.taper)*gfb);
    const swa=-Math.tan(P.sweep*DEG)*(gfa*P.span), swb=-Math.tan(P.sweep*DEG)*(gfb*P.span);
    const LEa=V3(swa+ca*0.35,0,sign*la), TEa=V3(swa-ca*0.65,0,sign*la);
    const LEb=V3(swb+cb*0.35,0,sign*lb), TEb=V3(swb-cb*0.65,0,sign*lb);
    push(LEa);push(LEb);push(TEa); push(TEa);push(LEb);push(TEb);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.computeVertexNormals();
  return g;
}

// Build ONE bird's mesh (returns a refs object). `lead` tints the lead bird.
function makeBirdMesh(lead){
  const root = new THREE.Group();
  const bodyLen = clamp(P.rootChord*2.2, 0.12, 0.9);
  const bodyR = clamp(bodyLen*0.28, 0.03, 0.22);
  const skin = new THREE.MeshStandardMaterial({color: lead?0x5cb6ff:0xe4dcc9, roughness:0.8});
  const dark = new THREE.MeshStandardMaterial({color:0x6b5b47, roughness:0.85});
  const wingMat = new THREE.MeshStandardMaterial({color:0xcfc3ad, roughness:0.7, side:THREE.DoubleSide, transparent:true, opacity:0.94});
  const wingMat2 = wingMat.clone(); wingMat2.color = new THREE.Color(0xbdb096);

  const hs=P.headScale||1, bs=P.beakScale||1, fold=clamp(P.neckFold||0,0,1);
  // torso: plumper and a touch shorter when the neck is folded (pelican) -> reads as a bird, not a blimp
  const torsoLen = bodyLen*(1 - 0.22*fold);
  const torso = new THREE.Mesh(new THREE.SphereGeometry(1,16,12), skin);
  torso.scale.set(torsoLen, bodyR*(1+0.28*fold), bodyR*0.92); root.add(torso);

  // HEAD + FOLDED NECK. Pelicans fly with the neck drawn back, the head resting on the shoulders and
  // the long deep bill projecting forward -- so at high neckFold the head sits just above the front of
  // the body (not out on a heron neck), joined by a short kinked neck.
  const head = new THREE.Group();
  const headR = bodyR*0.55*hs;
  const frontX = torsoLen*0.9;
  const headX = frontX*0.72 + P.neckLen*(1-fold);        // retracted toward the shoulders when folded
  const headY = bodyR*(0.55 + 0.85*fold);                // riding up on the shoulders when folded
  // short kinked neck from the shoulders up to the head
  const sX=torsoLen*0.5, sY=bodyR*0.5, ndx=headX-sX, ndy=headY-sY, nlen=Math.max(Math.hypot(ndx,ndy),0.02);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(headR*0.6, bodyR*0.74, nlen, 8), skin);
  neck.position.set((sX+headX)/2, (sY+headY)/2, 0);
  neck.rotation.z = Math.atan2(ndy,ndx) - Math.PI/2; head.add(neck);
  // head
  const hd = new THREE.Mesh(new THREE.SphereGeometry(headR,12,10), skin);
  hd.position.set(headX, headY, 0); head.add(hd);
  // long, deep bill (orange for a pelican), projecting forward and angled a touch down
  const beakMat = new THREE.MeshStandardMaterial({color:(P.beakHex==null?0x6b5b47:P.beakHex), roughness:0.6});
  const beakLen = P.neckLen*0.55*bs;
  const beak = new THREE.Mesh(new THREE.ConeGeometry(headR*0.48, beakLen, 10), beakMat);
  beak.rotation.z = -Math.PI/2; beak.position.set(headX + headR*0.55 + beakLen*0.5, headY - headR*0.12, 0);
  head.add(beak);
  // gular pouch: a soft warm bulge slung under the base of the bill (pelican signature)
  if(fold>0.4 || bs>1.6){
    const pouch = new THREE.Mesh(new THREE.SphereGeometry(1,10,8), beakMat);
    pouch.scale.set(beakLen*0.34, headR*0.44, headR*0.4);
    pouch.position.set(headX + headR*0.5 + beakLen*0.26, headY - headR*0.52, 0);
    head.add(pouch);
  }
  root.add(head);

  const tg = new THREE.BufferGeometry();
  const tl = P.tailLen*0.9, tw = Math.sqrt(P.tailArea)*1.1;
  tg.setAttribute('position', new THREE.Float32BufferAttribute([-bodyLen*0.7,0,0, -bodyLen*0.7-tl,0,tw*0.5, -bodyLen*0.7-tl,0,-tw*0.5],3));
  tg.computeVertexNormals();
  const tail = new THREE.Mesh(tg, wingMat); root.add(tail);

  const shoulderX = bodyLen*0.15, shoulderY = bodyR*0.55, shoulderZ = bodyR*0.7, L1 = P.span*P.innerFrac;
  function mkWing(sign){
    const shoulder=new THREE.Group(); shoulder.position.set(shoulderX, shoulderY, sign*shoulderZ);
    const inner=new THREE.Group(); shoulder.add(inner);
    inner.add(new THREE.Mesh(buildWingSeg(sign,0,P.innerFrac), wingMat));
    const elbow=new THREE.Group(); elbow.position.set(0,0,sign*L1); shoulder.add(elbow);
    const outer=new THREE.Group(); elbow.add(outer);
    outer.add(new THREE.Mesh(buildWingSeg(sign,P.innerFrac,1), wingMat2));
    const L2=P.span*(1-P.innerFrac), tipX=-Math.tan(P.sweep*DEG)*P.span;
    const feaMat=new THREE.MeshStandardMaterial({color:0x3d382c, roughness:0.9, side:THREE.DoubleSide});
    const feathers=[];
    for(let k=0;k<5;k++){
      const fg=new THREE.Group(); fg.position.set(tipX,0,sign*L2);
      const len=0.42*L2*(1-0.07*k), w=Math.max(0.01,0.06*P.rootChord*(1-0.12*k));
      const bx=new THREE.Mesh(new THREE.BoxGeometry(w,0.004,len), feaMat);
      bx.position.z=sign*len/2; fg.add(bx); fg.userData.k=k; outer.add(fg); feathers.push(fg);
    }
    root.add(shoulder);
    return {shoulder,inner,elbow,outer,feathers};
  }
  const R=mkWing(+1), Lw=mkWing(-1);
  flockRoot.add(root);
  // per-bird wingtip wake trails (world-space lines tracing each vortex core)
  const mkTrail=c=>{ const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(TRAIL_MAX*3),3));
    const ln=new THREE.Line(g,new THREE.LineBasicMaterial({color:c,transparent:true,opacity:0.4}));
    ln.frustumCulled=false; flockRoot.add(ln); return ln; };
  const trailR=mkTrail(lead?0xffd18a:0xffb454), trailL=mkTrail(lead?0x8fe9df:0x4bd6c9);
  return {root, skin, trailR, trailL, wingMats:[wingMat, wingMat2],
          wingR:R.shoulder, wingRin:R.inner, wingRelbow:R.elbow, wingRout:R.outer, wingRtips:R.feathers,
          wingL:Lw.shoulder, wingLin:Lw.inner, wingLelbow:Lw.elbow, wingLout:Lw.outer, wingLtips:Lw.feathers, tail};
}
function disposeMesh(mesh){
  if(!mesh) return;
  flockRoot.remove(mesh.root); mesh.root.traverse(o=>o.geometry&&o.geometry.dispose());
  if(mesh.trailR) flockRoot.remove(mesh.trailR);
  if(mesh.trailL) flockRoot.remove(mesh.trailL);
}
// (Re)build meshes for every bird, keeping their flight states. Called when wing geometry changes.
function rebuildMeshes(){
  for(const st of birds){
    disposeMesh(st.mesh);
    st.mesh = makeBirdMesh(st.leaderIdx==null);
    st.trailR=[]; st.trailL=[];
  }
}
function buildBird(){ rebuildMeshes(); }   // back-compat name used by slider handlers

/* --------------------------------------------------------- WIND VECTOR FIELD */
// A grid of 3D arrows showing the local wind, color-coded by vertical flow: green = updraft,
// red = downdraft, pale blue = level. The grid follows the flock and snaps to its spacing so the
// arrows appear to stream past. Toggle with P.vWind.
let windField=null; const WF_NX=6, WF_NY=3, WF_NZ=6, WF_DX=7, WF_DY=6, WF_DZ=7;
const _wfUp=new THREE.Color(0x39d98a), _wfDn=new THREE.Color(0xff6b6b), _wfMid=new THREE.Color(0x8fb8d8), _wfC=new THREE.Color();
function buildWindField(){
  if(windField) scene.remove(windField);
  windField=new THREE.Group();
  for(let i=0;i<WF_NX*WF_NY*WF_NZ;i++){
    const a=new THREE.ArrowHelper(V3(1,0,0), V3(), 1, 0x8fb8d8, 0.9, 0.5);
    a.line.material.transparent=true; a.line.material.opacity=0.7;
    a.cone.material.transparent=true; a.cone.material.opacity=0.85;
    windField.add(a);
  }
  windField.visible=false; scene.add(windField);
}
function updateWindField(){
  if(!windField) return;
  windField.visible=!!P.vWind;
  if(!P.vWind) return;
  const c=state?state.pos:V3(0,20,0);
  const ox=Math.round(c.x/WF_DX)*WF_DX, oy=WF_DY, oz=Math.round(c.z/WF_DZ)*WF_DZ;
  let idx=0;
  for(let ix=0;ix<WF_NX;ix++)for(let iy=0;iy<WF_NY;iy++)for(let iz=0;iz<WF_NZ;iz++){
    const px=ox+(ix-(WF_NX-1)/2)*WF_DX, py=oy+iy*WF_DY, pz=oz+(iz-(WF_NZ-1)/2)*WF_DZ;
    const a=windField.children[idx++];
    a.position.set(px,py,pz);
    const w=windAt(V3(px,py,pz)); const mag=w.length();
    if(mag<1e-3){ a.visible=false; continue; } a.visible=true;
    a.setDirection(w.clone().multiplyScalar(1/mag));
    a.setLength(clamp(mag*0.9,0.6,9), Math.min(mag*0.35,1.8), Math.min(mag*0.22,1.1));
    // color by vertical component (updraft vs downdraft)
    const vy=clamp(w.y/Math.max(mag,3), -1, 1);
    if(vy>=0) _wfC.copy(_wfMid).lerp(_wfUp, vy); else _wfC.copy(_wfMid).lerp(_wfDn, -vy);
    a.setColor(_wfC);
  }
}

/* ============================================================ PHYSICS ===== */
let state, derived={};
const NS1 = 4, NS2 = 5; // blade-element strips: inner segment, outer segment (per wing)

function recomputeDerived(){
  const m=P.mass;
  const mWing = m*P.wingMassFrac*clamp(P.boneThickness,0.3,3);   // both wings
  const mHead = m*P.headMassFrac;
  const mTail = m*P.tailMassFrac;
  const mTorso = Math.max(0.01, m - mWing - mHead - mTail);
  // center of mass (fore-aft), origin at torso center
  const comX = (mHead*P.neckLen - mTail*P.tailLen)/m;
  derived.com = V3(comX, 0, 0);
  derived.mWing=mWing; derived.mHead=mHead; derived.mTail=mTail; derived.mTorso=mTorso;
  // inertia (diagonal, body frame). rods & point masses.
  const s2 = P.span*P.span;
  const boneI = clamp(P.boneThickness,0.3,3);
  const Ixx = (1/3)*mWing*s2 + mTorso*0.02;                          // roll (wings dominate)
  const Izz = mHead*P.neckLen*P.neckLen + mTail*P.tailLen*P.tailLen + mTorso*0.03 + 0.02*mWing; // pitch
  const Iyy = Ixx*0.4 + Izz;                                          // yaw
  derived.I = V3(Math.max(Ixx,1e-3), Math.max(Iyy,1e-3), Math.max(Izz,1e-3));
  // flap DOF inertia (both wings as rods about shoulder) * bone thickness
  derived.Iflap = Math.max(1e-4, (1/3)*mWing*s2*boneI);
  // wing area (sum inner + outer strips, matching the blade-element discretization)
  let A=0;
  for(let i=0;i<NS1;i++){ const gf=P.innerFrac*(i+0.5)/NS1; const c=P.rootChord*(1-(1-P.taper)*gf); A+=c*(P.innerFrac*P.span/NS1); }
  for(let j=0;j<NS2;j++){ const gf=P.innerFrac+(1-P.innerFrac)*(j+0.5)/NS2; const c=P.rootChord*(1-(1-P.taper)*gf); A+=c*((1-P.innerFrac)*P.span/NS2); }
  derived.wingArea = A*2;
  derived.AR = (2*P.span)*(2*P.span)/derived.wingArea;
  // body drag frontal area
  derived.bodyA = 0.010*Math.pow(m,0.66);
  // muscle Fmax auto-scaled so strength~1 sustains flap for this bird
  const w = 2*Math.PI*P.flapFreq;
  const demand = derived.Iflap*w*w*(P.flapAmp*DEG) + 0.5*P.rho*(P.launchSpeed*P.launchSpeed)*derived.wingArea*P.span*0.25;
  derived.Fmax = P.muscleStrength * (demand/Math.max(P.momentArm,0.003)) * 5.0;
}

function makeBirdState(x0, z0){
  const a=P.launchAngle*DEG;
  const st = {
    pos:V3(x0, P.startAlt, z0),
    vel:V3(Math.cos(a)*P.launchSpeed, Math.sin(a)*P.launchSpeed, 0),
    quat:new THREE.Quaternion(), omega:V3(0,0,0),
    beta:0, betaDot:0, phase:Math.random()*6.283, fold:0, t:0, landed:false,
    flapping:true, leadX:x0+P.followDist, baseAlt:P.startAlt, targetAlt:P.startAlt, transT:0, aspS:null, phaseT:0, flaps:0, flapDuty:1,
    wakeWind:V3(), cmdRoll:0, cmdYaw:0, ampScale:1, effort:0,
    leaderIdx:null, side:0, rank:0, slotDz:0, fixedSide:+1, leadFlash:0,
    trailR:[], trailL:[],
    tel:{lift:0,thrust:0,drag:0,dragScalar:0,weight:P.mass*G,aoa:0,power:0,cyc:0,cycThrust:0,gap:0,coasting:false,foldDeg:0}
  };
  st.quat.setFromEuler(new THREE.Euler(0,0,a*0.4,'XYZ'));
  return st;
}
// Assign each bird a V-formation slot from the current `order` (order[0] = lead). Each bird's
// ARM (fixedSide) is fixed for life -- only ranks shift when the lead rotates -- so a peel-off
// never flips a bird across to the far arm (a 2*slotDz*rank lateral slam that would crash it).
// Within an arm, each bird drafts behind the previous bird on the SAME arm (the lead if it's
// the first out along that arm).
function assignFormation(){
  let lastR=null, lastL=null, rankR=0, rankL=0;
  for(let k=0;k<order.length;k++){
    const idx=order[k], st=birds[idx];
    if(k===0){ st.leaderIdx=null; st.side=0; st.rank=0; st.slotDz=0; }
    else if(st.fixedSide>0){ rankR++; st.side=+1; st.rank=rankR; st.slotDz=+P.slotDz; st.leaderIdx=(lastR!=null?lastR:order[0]); lastR=idx; }
    else { rankL++; st.side=-1; st.rank=rankL; st.slotDz=-P.slotDz; st.leaderIdx=(lastL!=null?lastL:order[0]); lastL=idx; }
  }
  // (Body/wing tinting is handled every frame by updateLeadColors so the light-blue lead — and its
  // white/blue transition flash — track the current point through rotations.)
}
function resetFlock(){
  recomputeDerived();
  for(const st of birds) disposeMesh(st.mesh);
  birds=[]; order=[]; flockT=0;
  const n=Math.max(1, Math.round(P.nBirds));
  for(let i=0;i<n;i++){
    const st = makeBirdState(0, 0);
    st.fixedSide = (i%2===1?+1:-1);      // arm membership, fixed for the bird's life
    st.mesh = makeBirdMesh(i===0);
    birds.push(st); order.push(i);
  }
  assignFormation();
  // place each bird at its assigned V slot (lead at origin, arms trailing back and out)
  for(const st of birds){
    st.pos.set(-st.rank*P.slotDx, P.startAlt, st.slotDz*st.rank);
    st.leadX = st.pos.x + P.followDist;
  }
  focus=0; state=birds[0]; telemetry=state.tel;
  flockRefX = birds[0].pos.x;             // reference line starts at the lead
  // reset the surface-skim cycle to a fresh high cruise
  skimState='cruise'; skimHold=0; flockBaseAlt=P.startAlt; skimCountdown=P.skimPeriod*(0.6+Math.random()*0.8);
  buildShadows();
  chartData.length=0;
}
function resetState(){ resetFlock(); }   // back-compat name used elsewhere

function windWorld(){ return V3(-P.headwind, P.updraft, P.crosswind); }
// Time- AND space-varying wind: the steady base plus smooth layered gusts, so the air is never
// truly still and different birds feel different air at the same moment -- which is what forces the
// flock to keep adjusting. Turbulence 0 = the old steady environment (good for tuning).
let windT = 0;
function windAt(pos){
  const w = V3(-P.headwind, P.updraft, P.crosswind);
  const s = P.turbulence||0;
  if(s>0){
    const t=windT, x=pos.x*0.06, z=pos.z*0.06, y=pos.y*0.05;
    // a few incommensurate sines in space+time -> smooth, non-repeating gust field
    const gx = Math.sin(x + 0.7*t) + 0.6*Math.sin(0.5*z - 1.13*t + 1.7);
    const gy = 0.8*Math.sin(0.8*x - 0.9*t + 2.1) + 0.7*Math.sin(0.6*z + 0.53*t) + 0.4*Math.sin(0.9*y+0.4*t);
    const gz = Math.sin(0.7*z + 0.83*t) + 0.6*Math.sin(0.45*x + 1.27*t + 0.6);
    w.x += s*gx; w.y += s*0.8*gy; w.z += s*gz;
  }
  return w;
}

// full-range lift/drag coefficients (blend linear -> flat plate past stall)
function aeroCoeffs(alpha){
  const aStall=P.stallDeg*DEG;
  const CLlin=P.clAlpha*alpha;
  const CLfp=1.9*Math.sin(2*alpha);
  let w=clamp(Math.abs(alpha)/(aStall*1.7),0,1); w=smooth(w);
  const CL=(1-w)*CLlin + w*CLfp;
  const CDlin=P.cd0 + P.inducedK*CLlin*CLlin;
  const CDfp=P.cd0 + 2.0*Math.sin(alpha)*Math.sin(alpha);
  const CD=(1-w)*CDlin + w*CDfp;
  return [CL,CD,w];
}

// Rodrigues rotation of v about unit axis k by angle th (returns new Vector3)
const _t1=V3(),_t2=V3();
function rot(v,k,th){
  const c=Math.cos(th), s=Math.sin(th);
  _t1.copy(k).cross(v);
  _t2.copy(k).multiplyScalar(k.dot(v)*(1-c));
  return V3(
    v.x*c + _t1.x*s + _t2.x,
    v.y*c + _t1.y*s + _t2.y,
    v.z*c + _t1.z*s + _t2.z
  );
}

// Commanded wingbeat: warped phase for down/up asymmetry. Returns beta and its 1st & 2nd
// derivatives w.r.t. phase (the 2nd is used by the muscle motor controller).
function flapKinematics(phase){
  const dwn = clamp(0.5 - P.upDownAsym*0.5, 0.15, 0.85);
  const ph = ((phase%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  let u, dudph;
  if(ph < 2*Math.PI*dwn){ u=(ph/(2*Math.PI*dwn))*Math.PI; dudph=Math.PI/(2*Math.PI*dwn); }
  else { u=Math.PI+((ph-2*Math.PI*dwn)/(2*Math.PI*(1-dwn)))*Math.PI; dudph=Math.PI/(2*Math.PI*(1-dwn)); }
  const amp=P.flapAmp*DEG*flapAmpScale;   // flapAmpScale tapers the beat down before coasting
  const beta   = amp*Math.cos(u);
  const dbeta  = -amp*Math.sin(u)*dudph;              // dβ/dphase
  const d2beta = -amp*Math.cos(u)*dudph*dudph;        // d²β/dphase²
  return [beta, dbeta, d2beta];
}

/* Compute all aerodynamic + muscle terms for the CURRENT state.
   Returns forces in WORLD, torque in BODY, generalized flap force, telemetry. */
const _q=new THREE.Quaternion(), _qi=new THREE.Quaternion(), _m=new THREE.Matrix4();
const _lvF=V3(), _lvU=V3(), _lvD=V3(), _lvQ=new THREE.Quaternion(), _lvI=new THREE.Quaternion();  // roll-leveler temps
function computeForces(st){
  const T = st.tel || (st.tel={});                       // per-bird telemetry
  const R=_m.makeRotationFromQuaternion(st.quat);
  const inv=_qi.copy(st.quat).invert();
  const wind=windAt(st.pos);
  if(st.wakeWind){                       // add the wake: vertical upwash always; forward slipstream gated so it can't overtake
    wind.x += st.wakeWind.x * (st.draftGate==null?1:st.draftGate);
    wind.y += st.wakeWind.y;
    wind.z += st.wakeWind.z;
  }
  // air velocity relative to COM, in BODY frame
  const relAir=V3().subVectors(wind, st.vel).applyQuaternion(inv);

  const netFbody=V3(), torqueBody=V3();
  let Qaero=0, Qgrav=0;
  let sumLiftUp=0, sumFwd=0, sumDrag=0, aoaAcc=0, aoaN=0, stalled=0;

  const dih=P.dihedral*DEG;
  const gBody=V3(0,-G,0).applyQuaternion(inv);

  // ---- FEATHER: dynamic nose-down twist on the downstroke (destall -> more thrust) ----
  const flapping = (st.flapping !== false);                     // false only while coasting
  const betaDotMax = Math.max(1e-3, P.flapAmp*DEG * 2*Math.PI*Math.max(P.flapFreq,0.01));
  const fr = clamp(st.betaDot/betaDotMax, -1.4, 1.4);
  const feath = (flapping && st.betaDot < 0) ? (P.featherAmp*DEG)*fr : 0;   // radians, nose-down on downstroke

  // ---- WING FOLD: the wing extends + stiffens on the downstroke for full force, and the
  // elbow flexes on the upstroke to shed span, area and flap inertia (cheap upstroke). The
  // flex scales with how RAISED the arm is, so it's greatest near the top of the upstroke --
  // that's when the swept-back hand hangs lowest and the wing reads as an "M".
  const ampR = Math.max(P.flapAmp*DEG, 1e-3);
  const upstroke = st.betaDot > 0;
  const armUp = clamp(st.beta/ampR, 0, 1);                      // 0 (level) .. 1 (fully raised)
  const fold01 = (flapping && upstroke) ? armUp : 0;           // flex the raised wing; extend for the downstroke
  const foldFrac = P.foldAmount * fold01;                       // 0..foldAmount
  const gamma = foldFrac * P.maxFoldDeg*DEG;                    // elbow flex angle (rad)
  const gammaDot = (flapping && upstroke && armUp>0 && armUp<1) ? P.foldAmount*(st.betaDot/ampR)*P.maxFoldDeg*DEG : 0;
  st.fold = foldFrac;
  T.foldDeg = foldFrac*P.maxFoldDeg;
  const foldNorm = clamp(gamma/Math.max(P.maxFoldDeg*DEG,1e-3), 0, 1);

  const L1 = P.span*P.innerFrac;                                // inner (humerus) length
  let Iflap = 0;                                                // dynamic flap inertia (both wings)

  // one blade element. twistRad = geometric AoA (rad); dAaero for forces, dAmass for inertia/gravity.
  function addStrip(sign, s, p, rFromSh, vWing, twistRad, dAaero, dAmass){
    const rC = V3().subVectors(p, derived.com);
    const dpdb = V3().crossVectors(V3(-sign,0,0), rFromSh);     // d(pos)/d(flap angle): whole wing about shoulder x
    const mstrip = derived.mWing*dAmass/Math.max(derived.wingArea,1e-4);
    Iflap += mstrip*dpdb.lengthSq();
    Qgrav += gBody.dot(dpdb)*mstrip;
    let chord=V3(1,0,0), normal=V3().crossVectors(s,chord); if(normal.y<0) normal.negate(); normal.normalize();
    const tw=twistRad*sign;
    chord=rot(chord,s,tw); normal=rot(normal,s,tw);
    const vRot=V3().crossVectors(st.omega, rC);
    const vRel=V3().copy(relAir).sub(vRot).sub(vWing);
    const sp2=vRel.lengthSq();
    if(sp2<1e-6) return;
    const uc=vRel.dot(chord), un=vRel.dot(normal);
    const alpha=Math.atan2(un, -uc);
    let [CL,CD,w]=aeroCoeffs(alpha);
    if(w>0.55) stalled++;
    let geMul=1;
    if(P.groundEffect){
      const worldY=st.pos.y + p.clone().applyQuaternion(st.quat).y;
      const h=Math.max(0.05,worldY);
      const ge=Math.exp(-h/(3*P.span));              // reaches ~a wingspan-and-a-half up
      geMul=1+P.geStrength*0.22*ge;                   // modest extra lift (kept small so it doesn't bounce the bird out of GE)
      CD=P.cd0+(CD-P.cd0)*(1-Math.min(0.9,0.9*P.geStrength*ge)); // induced drag largely collapses near the surface -> long cheap glides
    }
    const q=0.5*P.rho*sp2;
    const L=q*dAaero*CL*geMul, D=q*dAaero*CD;
    let liftDir=V3().crossVectors(vRel,s); if(liftDir.lengthSq()<1e-9) return;
    liftDir.normalize(); if(liftDir.dot(normal)<0) liftDir.negate();
    const dragDir=V3().copy(vRel).normalize();
    const F=V3().addScaledVector(liftDir,L).addScaledVector(dragDir,D);
    netFbody.add(F);
    torqueBody.add(V3().crossVectors(rC,F));
    Qaero += F.dot(dpdb);
    sumLiftUp+=L; sumDrag+=D; aoaAcc+=alpha; aoaN++;
  }

  for(const sign of [+1,-1]){
    const be = st.beta + dih;
    const s1 = V3(0, Math.sin(be), sign*Math.cos(be));           // inner spanwise
    const shoulder = V3(P.rootChord*0.1, 0.02, sign*0.03);
    let n1 = V3().crossVectors(s1, V3(1,0,0)); if(n1.y<0) n1.negate(); n1.normalize();  // wing normal = fold axis
    const omega1 = V3(-sign*st.betaDot, 0, 0);                   // inner-segment angular velocity (flap)
    const elbow = shoulder.clone().addScaledVector(s1, L1);
    // Elbow flexion is IN-PLANE, about the wing normal -- exactly like a real elbow, which
    // hinges in one plane; it cannot bend up/out of the wing. The hand sweeps back within
    // the (raised) wing plane, so a raised arm's swept hand naturally drops below the elbow.
    let s2=rot(s1, n1, -sign*gamma);                            // in-plane backsweep
    const omegaFold=n1.clone().multiplyScalar(-sign*gammaDot);
    const elbowVel = V3().crossVectors(omega1, V3().subVectors(elbow, shoulder));

    // INNER segment (rigid arm)
    for(let i=0;i<NS1;i++){
      const gf=P.innerFrac*(i+0.5)/NS1, r=gf*P.span;
      const c=P.rootChord*(1-(1-P.taper)*gf);
      const sw=-Math.tan(P.sweep*DEG)*r;
      const dA=c*(P.innerFrac*P.span/NS1);
      const p=V3(shoulder.x+sw+0.10*c, shoulder.y, shoulder.z).addScaledVector(s1, r);
      const rFromSh=V3().subVectors(p, shoulder);
      const vWing=V3().crossVectors(omega1, rFromSh);
      addStrip(sign, s1, p, rFromSh, vWing, P.innerAoA*DEG+feath, dA, dA);
    }
    // OUTER segment (hand-wing that folds on the upstroke)
    for(let j=0;j<NS2;j++){
      const gf=P.innerFrac+(1-P.innerFrac)*(j+0.5)/NS2, r2=(gf-P.innerFrac)*P.span;
      const c=P.rootChord*(1-(1-P.taper)*gf);
      const sw=-Math.tan(P.sweep*DEG)*(gf*P.span);
      const dA=c*((1-P.innerFrac)*P.span/NS2);
      const areaF=Math.max(1-0.45*foldNorm, 0.3);                // feather overlap reduces exposed area when folded
      const p=V3(elbow.x+sw+0.10*c, elbow.y, elbow.z).addScaledVector(s2, r2);
      const rFromSh=V3().subVectors(p, shoulder);
      const rFromEl=V3().subVectors(p, elbow);
      const vWing=V3().copy(elbowVel).add(V3().crossVectors(V3().addVectors(omega1, omegaFold), rFromEl));
      addStrip(sign, s2, p, rFromSh, vWing, P.outerAoA*DEG+feath, dA*areaF, dA);
    }
  }
  derived.IflapDyn = Math.max(1e-4, Iflap);

  // ---- TAIL (horizontal stabilizer) as a single strip at the rear ----
  {
    const rC=V3(-P.tailLen,0,0).sub(derived.com);
    const vRot=V3().crossVectors(st.omega,rC);
    const vRel=V3().copy(relAir).sub(vRot);
    const sp2=vRel.lengthSq();
    if(sp2>1e-6){
      const s=V3(0,0,1);
      let chord=V3(1,0,0), normal=V3(0,1,0);
      const th=P.tailIncidence*DEG;
      chord=rot(chord,s,th); normal=rot(normal,s,th);
      const uc=vRel.dot(chord), un=vRel.dot(normal);
      const alpha=Math.atan2(un,-uc);
      const [CL,CD]=aeroCoeffs(alpha);
      const q=0.5*P.rho*sp2;
      const L=q*P.tailArea*CL, D=q*P.tailArea*CD;
      let liftDir=V3().crossVectors(vRel,s).normalize(); if(liftDir.dot(normal)<0) liftDir.negate();
      const dragDir=V3().copy(vRel).normalize();
      const F=V3().addScaledVector(liftDir,L).addScaledVector(dragDir,D);
      netFbody.add(F); torqueBody.add(V3().crossVectors(rC,F));
      sumDrag+=D;
    }
  }

  // ---- convert aero force to world ----
  const aeroWorld=netFbody.clone().applyQuaternion(st.quat);

  // ---- body (fuselage) parasitic drag, world ----
  const vair=V3().subVectors(st.vel, wind); const spd=vair.length();
  const Fbd=V3();
  if(spd>1e-4) Fbd.copy(vair).multiplyScalar(-0.5*P.rho*P.bodyCd*derived.bodyA*spd);
  // wingtip primary-feather brake: spreading the primaries adds drag to decelerate and control.
  // A drafting glide is otherwise CLEAN (low drag) so a bird can ride it a long way; the user can
  // dial tipSpread up as a manual airbrake. It ALSO auto-flares (st.brake) when a bird is overrunning
  // the one ahead -- that's what stops followers sliding past the no-draft lead (esp. during a skim,
  // where everyone glides and the lead, with the most drag, would otherwise drop into the pack).
  const tipSp = clamp((P.tipSpread||0) + (st.brake||0), 0, 1);
  let tipBrake=0;
  if(spd>1e-4 && tipSp>0.02){
    tipBrake = 0.5*P.rho*spd*spd*((0.06+0.16*(st.brake||0))*derived.wingArea)*tipSp;   // stronger flare when actively braking
    Fbd.addScaledVector(V3().copy(vair).multiplyScalar(1/spd), -tipBrake);
  }

  // ---- gravity ----
  const Fg=V3(0,-P.mass*G,0);

  const netWorld=V3().add(aeroWorld).add(Fbd).add(Fg);

  // ---- FORMATION STATION-KEEPING (lateral steering trim) ----
  // Holding a slot sideways is a steering task (the bird banks/sideslips), not propulsion, so
  // it gets a dedicated well-damped lateral force here instead of relying on bank-to-translate
  // (too twitchy under flapping's variable lift). Forward propulsion is NOT assisted -- x-station
  // stays entirely flap-driven. Capped at a fraction of weight so it reads as a trim, not a jet.
  // ---- ALTITUDE HOLD (bounded vertical trim) ----
  // Attitude/pitch alone leaves a slow flap-coast phugoid that diverges into a dive after ~45s.
  // A real bird actively modulates its lift (wing area, AoA, tail) to hold height; model that as
  // a bounded vertical spring-damper toward the cruise line. It decouples the two jobs cleanly:
  // the wingbeat still provides all the FORWARD thrust (emergent, not assisted), and a coast
  // still bleeds SPEED to drag (which is what drives the drafting wave) -- this only stops the
  // height from wandering. Capped well under a g so it's a trim, not a lift jet.
  if(st.targetAlt!=null && P.flapStrategy==='intermittent'){
    // Cap is generous (1.0 W) but only ever bites on a BIG vertical move -- at cruise the error is
    // tiny so the trim is a whisper. The headroom is what lets the flock actually DESCEND to skim:
    // a coasting glide speeds up and its lift climbs past W, so a weak cap couldn't overcome the
    // excess lift and the dive stalled out halfway down. This lets the lead's dip reach the surface.
    const W=P.mass*G, capY=1.0*W;
    const fy = P.mass*(1.8*(st.targetAlt - st.pos.y) - 2.6*st.vel.y);
    netWorld.y += clamp(fy, -capY, capY);
  }
  // HARD WATER CUSHION (safety, uncapped): below ~1.2 m an escalating upward push plus a strong
  // arrest of any downward speed keeps a downgust -- or an over-eager dip -- from actually ditching
  // a bird into the sea during a surface skim. It's silent above 1.2 m, so it never touches cruise.
  if(st.pos.y < 1.6){
    const d = 1.6 - st.pos.y;
    netWorld.y += P.mass*(12.5*d + (st.vel.y<0 ? -5.0*st.vel.y : 0));
  }

  if(st.slotZv!=null){
    const W=P.mass*G, capZ=0.52*W;
    // Cascade with a capped closing SPEED: a large slot error must not spin up a big sideways
    // velocity -- that sideslip tilts the relative wind, robs the wings of vertical lift, and
    // the bird dives. Capping lateral speed keeps sideslip small, so even a big reposition
    // (a peeled-off lead sliding out to a tail slot) stays level.
    // Gentle position pull with firm side-velocity damping: keeps station while damping the
    // sideslip that would feed dihedral roll (Dutch roll). Kept modest so it doesn't itself
    // pump the lateral mode.
    const vzT = clamp(0.45*(st.slotZv - st.pos.z), -2.0, 2.0);   // higher cap so the flock can track the coast's sway
    const fz = P.mass*2.2*(vzT - st.vel.z);
    netWorld.z += clamp(fz, -capZ, capZ);
  }

  // ---- angular aerodynamic damping (airframe + feathers), body frame ----
  const qref=0.5*P.rho*Math.max(spd*spd, 4);
  const dampT=V3().copy(st.omega).multiplyScalar(-P.angDamp*qref*0.02*derived.wingArea*P.span);
  torqueBody.add(dampT);

  // ---- ACTIVE STABILIZATION: a bird's tail/head/wing reflexes (closed-loop).
  // Drives pitch toward a trim attitude and levels roll, with a yaw damper. At
  // stab=0 you get the raw open-loop dynamics (phugoid, upsets); turn it up to fly.
  if(P.stab>0){
    const fwd=V3(1,0,0).applyQuaternion(st.quat);
    const right=V3(0,0,1).applyQuaternion(st.quat);
    // In flap-coast, hold the flock's altitude line by commanding pitch (outer loop):
    // pitch up when sagging below it, nose down when above -- so flapping climbs and
    // coasting descends around a stable mean instead of drifting into the water.
    // Active altitude hold: command pitch to hold the cruise line and damp vertical rate.
    // Applies in both flap strategies (a real bird actively holds its height); disabled only
    // when stabilization is off, so stab=0 still shows the raw open-loop phugoid.
    const altErr=(st.targetAlt||st.pos.y)-st.pos.y;
    // Stiff, over-damped pitch loop with strong vertical-rate damping: holds a firm altitude
    // trim and actively arrests a sink, so the slow flap-coast phugoid can't build into a dive.
    const trimEff=clamp(P.trimPitch + 1.6*altErr - 2.6*st.vel.y, -10, 22);
    const pitchErr=fwd.y - Math.sin(trimEff*DEG);       // nose elevation vs (altitude-holding) trim
    // Physics roll is held WINGS-LEVEL (the strongest, most stable choice). Lateral station is
    // done by the dedicated damped side-force above, not by banking -- letting the roll loop bank
    // to translate makes an underdamped roll/side-slip loop that diverges after ~40s. The visual
    // bank (birds do lean into a correction) is added cosmetically to the mesh, off the physics.
    const rollErr=right.y;                                // target 0 = wings level
    const wn=4.6, ze=1.1, g=P.stab;
    const aPitch=(-wn*wn*pitchErr - 2*ze*wn*st.omega.z)*g;
    // Roll leveling + DIRECTIONAL (weathercock) stability. Dihedral turns any sideslip into
    // roll; without a yaw stiffness pulling the nose back to the flight line, that pairing is a
    // divergent spiral -- level for a minute, then a numerical nudge winds it into a flip. The
    // heading term is the missing vertical-tail effect: it holds the nose along the flight line
    // (+x), which makes roll=0 a genuinely stable equilibrium.
    const head=Math.atan2(fwd.z, fwd.x);                 // heading error off the flight line
    // NB roll's restoring sign is OPPOSITE pitch's: right.y = -sin(roll) whereas fwd.y = +sin(pitch),
    // so the spring term is +wn^2*rollErr (a - sign here silently makes roll leveling DIVERGENT).
    const aRoll =(+1.4*wn*wn*rollErr - 2*6.5*wn*st.omega.x)*g;
    // Yaw weathercock: like roll, the restoring sign is +, not - (a rotation about body-up by +omega.y
    // DECREASES the heading, so restoring toward the flight line needs +head). A - here is positive
    // feedback: the heading drifts over minutes until the whole flock quietly turns around and flies
    // backward. Strong yaw-rate damping keeps the Dutch-roll mode dead.
    const aYaw  =(+0.7*wn*wn*head - 2*6.5*wn*st.omega.y)*g;
    torqueBody.z += derived.I.z*aPitch;
    torqueBody.x += derived.I.x*aRoll;
    torqueBody.y += derived.I.y*aYaw;
    T.ctrlPitch = derived.I.z*aPitch;
  }

  // ---- world-frame force decomposition for readouts ----
  const flightDir=V3(vair.x,0,vair.z); const fdlen=flightDir.length();
  if(fdlen>1e-3) flightDir.multiplyScalar(1/fdlen); else flightDir.set(1,0,0);
  const up=V3(0,1,0);
  const liftN = aeroWorld.dot(up);                    // vertical aero force
  const fwdN  = aeroWorld.clone().sub(Fbd.clone().multiplyScalar(0)).dot(flightDir); // net aero along flight
  T.lift = liftN;
  T.thrust = aeroWorld.dot(flightDir) + Fbd.dot(flightDir); // net forward (aero+bodydrag)
  T.dragScalar = sumDrag + spd*0.5*P.rho*P.bodyCd*derived.bodyA*spd + tipBrake;
  T.aoa = aoaN? (aoaAcc/aoaN) : 0;
  T.stalled = stalled;
  T.aeroWorld = aeroWorld;
  T.flightDir = flightDir;
  T.Fg = Fg;

  return {netWorld, torqueBody, Qaero, Qgrav};
}

// Maximum torque the two flight muscles can deliver about the flap axis RIGHT NOW,
// as a function of muscle state. Depressor (pectoralis) pulls the wing DOWN, elevator
// (supracoracoideus) pulls it UP. Each is limited by strength, a length-tension curve
// (falls off away from optimal wing angle) and a Hill force-velocity curve (force drops
// the faster the muscle shortens; it can resist more while being stretched).
function muscleCapacity(st){
  const flDep=Math.exp(-Math.pow((st.beta*RAD - P.muscleOptBeta)/P.muscleWidth, 2));
  const flEle=Math.exp(-Math.pow((st.beta*RAD + P.muscleOptBeta)/P.muscleWidth, 2));
  const hill=v => v>=0 ? clamp((P.vmax - v)/(P.vmax + 3*v), 0, 1) : 1.4;  // concentric / eccentric
  const capDep=Math.max(0, derived.Fmax*P.momentArm*flDep*hill(-st.betaDot));
  const capEle=Math.max(0, derived.Fmax*P.momentArm*P.elevatorFrac*flEle*hill(st.betaDot));
  return {dep:capDep, ele:capEle};
}

let flapAmpScale=1;   // 1 normally; tapers <1 as the bird eases out of a flap burst into a coast
/* ---------------------------------------------------- PER-BIRD PHYSICS STEP */
// Advance ONE bird by dt: run its flap DOF (coast / prescribed / muscle), the
// aero + muscle force model, then the 6-DOF body integrator. flockControl (below)
// has already set st.flapping, st.ampScale, st.cmdRoll/cmdYaw and st.wakeWind.
function stepBird(st, dt){
  const T = st.tel;
  flapAmpScale = st.ampScale || 1;             // per-bird beat taper (read by flapKinematics)

  if(!st.flapping){
    // COAST: relax the wing to its glide angle and glide -- no flapping thrust, so the
    // bird slowly loses speed to drag (fold & feather are gated off in computeForces).
    const bt=P.coastBeta*DEG, a=1-Math.exp(-dt/0.12);
    const nb=st.beta+(bt-st.beta)*a;
    st.betaDot=(nb-st.beta)/dt; st.beta=nb;
    const f=computeForces(st);
    stepBody(st,f,dt);
    T.power=0;
  } else if(P.mode==='prescribed'){
    const phaseDot=2*Math.PI*P.flapFreq;
    const [beta,dbeta]=flapKinematics(st.phase);
    st.beta=beta; st.betaDot=dbeta*phaseDot;
    st.phase += phaseDot*dt;
    const f=computeForces(st);
    stepBody(st,f,dt);
    T.power = Math.abs((f.Qaero)*st.betaDot);   // aerodynamic flap power
  } else {
    // MUSCLE-DRIVEN: the bird commands a wingbeat; the muscles try to follow it but can
    // only deliver up to their available torque. Enough strength (and a folded, low-load
    // upstroke) -> it tracks the command and flies. Too weak, wings too heavy/dense air,
    // or fold turned off -> the muscles saturate, the wingbeat falls short, and it sinks.
    const phaseDot=2*Math.PI*Math.max(P.flapFreq,0.001);
    const [bt,dbt,d2bt]=flapKinematics(st.phase);
    const btDot=dbt*phaseDot, btDDot=d2bt*phaseDot*phaseDot;
    const f=computeForces(st);
    const Ifl=derived.IflapDyn||derived.Iflap;
    const cDamp=0.02*Ifl*phaseDot;
    const kp=Math.pow(0.6*phaseDot,2), kd=2*0.9*(0.6*phaseDot);
    const tauFF = Ifl*btDDot - f.Qaero - f.Qgrav + cDamp*btDot;
    const tauFB = Ifl*(kp*(bt-st.beta) + kd*(btDot-st.betaDot));
    const tauReq = tauFF + tauFB;
    const cap=muscleCapacity(st);
    const tauAct = clamp(tauReq, -cap.dep, cap.ele);   // depressor(−) / elevator(+) limits
    const betaDDot=(tauAct + f.Qaero + f.Qgrav - cDamp*st.betaDot)/Ifl;
    st.betaDot += betaDDot*dt; st.betaDot=clamp(st.betaDot,-60,60);
    st.beta += st.betaDot*dt; st.beta=clamp(st.beta,-80*DEG,80*DEG);
    st.phase += phaseDot*dt;
    stepBody(st,f,dt);
    T.power=Math.abs(tauAct*st.betaDot);        // real muscle mechanical power
    const have=(tauReq<0?cap.dep:cap.ele);
    T.effort = have>1e-6 ? clamp(Math.abs(tauReq)/have,0,2) : 2;   // >1 = saturated
  }
  // running energy tally (compare lead vs drafting followers) + cycle-avg thrust
  st.effort = (st.effort||0) + (T.power||0)*dt;
  T.cyc += dt;
  T.cycThrust = 0.98*T.cycThrust + 0.02*(T.thrust||0);
  st.t += dt;
}

/* ---------------------------------------------------- FLOCK CONTROL (per bird) */
// Decide, for one bird, whether to flap or coast and how to steer, from its
// V-formation slot. The lead keeps station with a virtual pace-setter; followers
// key off the ACTUAL bird ahead, so a leader's flap surge opens the gap and trips
// the next bird a beat later -- the drafting wave runs backward through the V.
function flockControl(st, dt){
  const T=st.tel, w0=windAt(st.pos);
  const asp=V3().subVectors(st.vel,w0).length();
  st.aspS=(st.aspS==null)?asp:st.aspS+(asp-st.aspS)*0.02;
  st.gsS=(st.gsS==null)?st.vel.x:st.gsS+(st.vel.x-st.gsS)*0.02;   // smoothed groundspeed (pace is a groundspeed)
  st.phaseT=(st.phaseT||0)+dt;

  const lead = st.leaderIdx==null;
  const leadBird = birds[order[0]];
  // Fore/aft the WAVE trigger is the gap to the ACTUAL bird immediately ahead (chained). But a pure
  // chain is string-unstable -- drift amplifies down the arm until a bird is ejected -- so each bird
  // also knows its slot on a SMOOTH flock line (flockRefX, cruising at pace). That absolute error
  // only biases burst TIMING (below), never adds a force: a bird behind the line bursts a touch
  // sooner / more often, one ahead glides longer, so the flock stays bounded without being "pushed".
  // the LEAD aims its z at the coast-following centre-line (so the whole flock traces the shoreline);
  // followers key off the lead's actual z as before, so the V rides along with it. During a skim the
  // follow line is FROZEN (skimFreezeX) so the flock hydroplanes straight along the surf, not weaving.
  const absSlotZ = lead ? coastFollow(skimState==='cruise' ? st.pos.x : skimFreezeX)
                        : (leadBird.pos.z + st.side*P.slotDz*st.rank);
  const smoothSlotX = flockRefX - st.rank*P.slotDx;      // this bird's nominal x on the flock line
  const absErr = smoothSlotX - st.pos.x;                 // >0 = behind the line
  let gap, desiredGap, aheadVx;
  if(lead){
    st.leadX = flockRefX;                                // lead's pace-setter IS the flock line
    gap = flockRefX - st.pos.x; desiredGap = 0;          // the lead holds the line (no draft -> works hardest)
    aheadVx = P.paceSpeed;                               // the line it chases advances at the flock pace
  } else {
    const ld = birds[st.leaderIdx] || leadBird;
    gap = ld.pos.x - st.pos.x; desiredGap = P.followDist; // hold THIS gap behind the bird immediately
    aheadVx = ld.gsS!=null ? ld.gsS : ld.vel.x;           // ahead ("Target follow distance"), matching its speed
  }
  st.slotX=smoothSlotX; st.slotZv=absSlotZ; T.gap=gap;
  const zErr = absSlotZ - st.pos.z;

  // DRAFT GATE (stops the lead being overtaken): the slipstream's forward push is what let drafting
  // followers ride PAST the bird ahead and, chained up the arm, past the no-draft lead itself -- so
  // the "lead" ended up mid-pack. Gate that forward push by fore/aft spacing: full draft when the
  // bird sits at or behind its slot, fading to zero as it closes within minGap of the bird ahead.
  // The line still gets pulled along (a lagging bird catches up), but no one can shoot past the bird
  // in front, so the chain -- rooted at the lead -- keeps the lead at the point.
  if(lead){ st.draftGate = 1; st.brake = 0; }
  else {
    const minGap=0.8;
    st.draftGate = clamp((gap - minGap)/Math.max(desiredGap - minGap, 0.1), 0, 1);
    // auto-flare when overrunning the bird ahead: 0 at/behind the slot, ramping to full as the gap
    // closes toward minGap. Plus a touch keyed to the closing rate so it anticipates. This is what
    // guarantees the chain order (and the lead at the point), not an average that occasionally slips.
    const over = (desiredGap - gap)/Math.max(desiredGap - minGap, 0.1);
    const closingAhead = st.gsS - aheadVx;               // >0 = self faster than the bird ahead (gaining)
    st.brake = clamp(0.9*over + 0.3*closingAhead, 0, 1);
  }

  // Brief climb-out ONLY during an actual peel-off (lead rotation on) and only for a genuinely big
  // relocation -- otherwise an ordinary straggler would wrongly climb out of the draft and never
  // rejoin. Gated off in normal formation flight.
  // The whole flock holds ONE base altitude set by the lead's skim cycle (flockBaseAlt), so a dip to
  // the surface and the climb back happen together, led from the front.
  const base = flockBaseAlt;
  const far = P.leadRotate && !lead && P.nBirds>1 && (Math.abs(absErr) > P.slotDx*2.5 || Math.abs(zErr) > P.slotDz*2.0);
  st.transT = far ? 1.5 : Math.max(0, (st.transT||0) - dt);
  st.targetAlt = base + (st.transT>0 ? 4 : 0);

  if(P.flapStrategy==='intermittent'){
    const line=st.targetAlt||P.startAlt;
    // PD STATION-KEEPING. The old controller reacted only to how far BEHIND its slot a bird had
    // fallen, so a bird coasted until the gap was big, then flapped hard, charged through the slot
    // and sagged back -- the "clump and separate" surging Will saw, and a lead that steadily pulled
    // away because followers reacted too late. Now each bird also watches its CLOSING RATE on the
    // bird ahead (the D term): it flaps when it is behind OR falling behind, and eases the instant
    // it is on-station AND speed-matched -- so it settles onto an even, close gap instead of
    // overshooting. The gap error still lags naturally down the line, so the drafting wave survives.
    const gapErr   = gap - desiredGap;                    // >0 = fallen behind the slot
    const closing  = aheadVx - st.gsS;                    // >0 = the bird/line ahead is pulling away
    const spdDef   = P.paceSpeed - st.gsS;                // >0 = below the flock pace (groundspeed)
    const demand   = 1.0*gapErr + 1.3*closing + 0.15*Math.max(0, spdDef-0.5);
    const slow     = st.aspS < 0.78*P.paceSpeed;          // stall safety (airspeed)
    // water safety: keep well clear of the surface at cruise, but during a skim the whole point is
    // to ride LOW, so the floor drops with the commanded (skim) altitude instead of forcing a climb.
    const floor    = clamp(line*0.5, 0.7, 2.5);
    const absFloor = st.pos.y < floor;
    const tooFast  = st.gsS > 1.25*P.paceSpeed;           // hard groundspeed cap -> never run away
    const deadband = 0.25;                                // hold tight, but still glide when on-station & matched
    if((demand > deadband && !tooFast) || slow || absFloor){
      st.flapping = true;
      st.ampScale = clamp(0.3 + 0.42*demand + (slow?0.4:0) + (absFloor?0.5:0), 0.3, 1);
    } else {
      st.flapping = false; st.ampScale = 0;
    }
    T.coasting=!st.flapping;
  } else {
    st.flapping=true; st.ampScale=1; T.coasting=false;
  }
  st.flapDuty=0.996*(st.flapDuty==null?1:st.flapDuty)+0.004*(st.flapping?1:0);

  // lateral station-keeping is a STEERING task (sideslip to hold slot), not propulsion, so it
  // gets a dedicated, well-damped lateral force in computeForces -- bank-to-translate alone is
  // too twitchy under the variable lift of flapping. Here we just record the slot error and a
  // matching visual bank (birds do lean into the correction); the force uses st.slotZv.
  const bankVis=clamp(0.06*zErr - 0.15*st.vel.z, -0.30, 0.30);   // decorative lean (~17deg)
  st.cmdRoll=(st.cmdRoll||0)+(bankVis-(st.cmdRoll||0))*0.05;
  const fwd=V3(1,0,0).applyQuaternion(st.quat);
  const head=Math.atan2(fwd.z,fwd.x);
  st.cmdYaw=clamp(-2.5*head - 1.0*st.omega.y, -4, 4);
}

/* ---------------------------------------------------- WINGTIP WAKES / DRAFT */
// Two coupled wake effects from the birds AHEAD, both fed into a bird's local wind (st.wakeWind):
//
//  1. VERTICAL (wakeWind.y) -- wingtip vortices. A bird sitting outboard of another's tip rides
//     that wing's UPWASH (a lift bonus); between the tips it's downwash. This is the V benefit.
//
//  2. HORIZONTAL (wakeWind.x) -- the reduced-drag SLIPSTREAM. Every bird drags a slug of air along
//     with it (its momentum wake). A bird tucked into that co-moving air behind another meets a
//     LOWER relative headwind, so its drag drops sharply -- it glides far on little effort, and the
//     SAME wingbeat now nets more forward force (Will's "rank-3 flaps but doesn't accelerate" was
//     exactly a missing slipstream). Because the channel is anchored to the bird ahead and fades
//     with the fore/aft gap, a leader's surge sweeps the low-drag channel back over the next bird,
//     whose next beat then bites harder and pulls it up -- the effort/acceleration runs down the
//     line as a wave. That is the "rubber band" connecting the file: no direct forward force (that
//     would be "stepping on the gas"); the coupling emerges from recovered wake momentum + drag.
function computeWakes(){
  const rho=P.rho, Vref=Math.max(P.paceSpeed,3), rc=Math.max(P.wakeCore,0.05);
  const bprime=(Math.PI/4)*2*P.span, tipZ=P.span*0.9;
  const L=P.mass*G, Gam=L/(rho*Vref*bprime);   // bound-circulation estimate (each bird ~ its weight)
  const k=Gam/(2*Math.PI);
  const sw2=Math.max(P.slipWidth,0.2)**2, sld=Math.max(P.slipDecay,0.5);
  for(const st of birds){
    if(!st.wakeWind) st.wakeWind=V3();
    st.wakeWind.set(0,0,0); st.tel.upwash=0; st.draftFactor=0; st.tel.draft=0;
    if(!P.draft) continue;
    let wy=0, df=0;
    for(const other of birds){
      if(other===st) continue;
      const dx=other.pos.x - st.pos.x;          // >0 : 'other' is ahead
      if(dx<=0.05 || dx>P.wakeRange) continue;
      const decay=Math.exp(-dx/Math.max(P.wakeDecay,1));
      const dy=st.pos.y - other.pos.y;
      // vertical tip-vortex upwash/downwash
      for(const s of [+1,-1]){                   // the two wingtips of 'other'
        const zc=other.pos.z + s*tipZ;
        const dz=st.pos.z - zc;
        wy += s*k*dz/(dz*dz + dy*dy + rc*rc)*decay;   // outboard of a tip = upwash
      }
      // reduced-drag slipstream: deepest where this bird sits squarely in the co-moving wake
      // (small lateral+vertical offset from the bird ahead) and close behind (fades downstream).
      const dzc=st.pos.z - other.pos.z;
      const lat=Math.exp(-(dzc*dzc + dy*dy)/sw2);
      const wake=lat*Math.exp(-dx/sld);
      if(wake>df) df=wake;                        // ride the single deepest wake, don't stack them
    }
    // Clamp the downwash side hard (a mispositioned bird shouldn't get slammed down and thrown out
    // of formation) while letting the upwash benefit be strong -- so a well-placed follower's drag
    // is largely cancelled and it can glide a long way on the draft.
    st.wakeWind.y = clamp(P.draftStrength*wy, -0.4, 3.5);
    st.tel.upwash = st.wakeWind.y;
    // co-moving forward air: a slug of the flight-direction airflow that follows the bird ahead.
    // Reduces the follower's relative airspeed -> lower drag, and couples the line (rubber band).
    df=clamp(df,0,1); st.draftFactor=df; st.tel.draft=df;
    st.wakeWind.x = P.draftPull*df;
  }
}

/* ---------------------------------------------------- LEAD ROTATION (peel-off) */
// Breaking the headwind is the tiring job, so the lead hands it off. Every rotatePeriod the tired
// lead PEELS OFF and drops to the very BACK of the formation, and every other bird moves up one
// slot -- a true round-robin. Cycling the whole line (rather than the old trade with a single
// wingman, which just ping-ponged the point between the same two birds) means every bird takes a
// turn at the front over time, so no pair burns out -- which is exactly why wild flocks keep
// rotating the lead. Only the relieved bird makes a big move (the long drift to the tail); the
// rest shift by a single slot. Each then flies to its new slot under the normal station-keeping.
function leadRotation(dt){
  if(!P.leadRotate || birds.length<2) return;
  if(skimState!=='cruise') return;          // don't hand off the lead mid dip-and-rise; the bird
                                            // that called the skim sees it through (flockT pauses too)
  flockT += dt;
  if(flockT >= P.rotatePeriod){
    flockT = 0;
    order.push(order.shift());               // old lead -> back; everyone else advances one slot
    assignFormation();
    birds[order[0]].leadFlash = 3.0;         // new lead flashes white/blue while it takes the point
    // Let the just-relieved bird climb clear and drift back to the tail instead of barging straight
    // through the flock on its way down the line.
    const relieved = birds[order[order.length-1]];
    if(relieved){ relieved.transT = Math.max(relieved.transT||0, 2.5); }
  }
}

/* ---------------------------------------------------- SURFACE-SKIM CYCLE (lead's call) */
// Real pelicans working the surf line drop down and hydroplane just over the water in ground
// effect -- scanning for fish -- then climb back to cruise. It's the LEAD's decision and the whole
// flock follows, so this drives ONE shared base altitude (flockBaseAlt) that every bird holds its
// slot at. cruise (up high) -> descend -> skim (ride the surface for skimDuration) -> ascend. The
// lead is NOT swapped until the full dip-and-rise completes (see leadRotation).
function updateSkim(dt){
  const cruiseA=P.startAlt, rate=2.2;      // gentle ~2 m/s climb/descent of the shared base altitude
  if(!P.skimEnable){ skimState='cruise'; flockBaseAlt += (cruiseA-flockBaseAlt)*Math.min(1,dt*1.5); return; }
  if(skimState==='cruise'){
    flockBaseAlt += (cruiseA-flockBaseAlt)*Math.min(1,dt*1.2);
    skimCountdown -= dt;
    if(skimCountdown<=0){ skimState='descend'; skimFreezeX = birds.length?birds[order[0]].pos.x:0; }  // lock the coast-follow line for the dip
  } else if(skimState==='descend'){
    flockBaseAlt = Math.max(P.skimAlt, flockBaseAlt - rate*dt);
    if(flockBaseAlt <= P.skimAlt+0.05){ skimState='skim'; skimHold=P.skimDuration; }
  } else if(skimState==='skim'){
    flockBaseAlt += (P.skimAlt-flockBaseAlt)*Math.min(1,dt*1.5);
    // only start counting the skim once the flock has actually reached the surface (the glide down
    // is rate-limited), so we always get a full skimDuration of real hydroplaning near the water.
    const lead=birds.length?birds[order[0]]:null;
    const arrived = !lead || lead.pos.y < P.skimAlt+1.4;
    if(arrived) skimHold -= dt;
    if(skimHold<=0) skimState='ascend';
  } else { // ascend
    flockBaseAlt = Math.min(cruiseA, flockBaseAlt + rate*dt);
    if(flockBaseAlt >= cruiseA-0.1){ skimState='cruise'; skimCountdown = P.skimPeriod*(0.6+Math.random()*0.8); }
  }
}

/* ---------------------------------------------------- STEP THE WHOLE FLOCK */
function stepFlock(dt){
  windT += dt;                             // advances the gust field
  updateSkim(dt);                          // advance the shared dip/rise altitude
  // The smooth flock line cruises at the pace -- but a real lead doesn't sprint off and leave the
  // flock strung out behind it; it sets a pace the group can actually hold. So THROTTLE the line's
  // advance whenever the formation is stretched beyond its nominal length: the lead eases, the tail
  // catches up, and the line stays tight and evenly spaced. (This, plus the PD followers, is what
  // fixes "the lead gets way ahead" and the clump/separate surging.)
  if(birds.length){
    const leadX=birds[order[0]].pos.x;
    let tailX=Infinity, maxRank=0;
    for(const b of birds){ if(b.pos.x<tailX) tailX=b.pos.x; if(b.rank>maxRank) maxRank=b.rank; }
    const nominalLen=Math.max(maxRank*P.followDist, 0.1);
    const stretch=(leadX - tailX) - nominalLen;               // >0 = strung out beyond the nominal V
    const throttle=clamp(1 - stretch/(1.5*P.followDist), 0.15, 1);  // ease the pace as it stretches
    flockRefX += P.paceSpeed*throttle*dt;
    flockRefX = clamp(flockRefX, leadX-1.5, leadX + P.followDist + P.draftBand);
    T_flockThrottle = throttle;
  } else {
    flockRefX += P.paceSpeed*dt;
  }
  computeWakes();
  for(const st of birds) flockControl(st, dt);
  for(const st of birds) stepBird(st, dt);
  leadRotation(dt);
}
// back-compat single entry point (render loop + headless tests call this)
function integrate(dt){ stepFlock(dt); }

function stepBody(st, f, dt){
  // translational
  const acc=f.netWorld.clone().multiplyScalar(1/P.mass);
  st.vel.addScaledVector(acc, dt);
  st.pos.addScaledVector(st.vel, dt);
  // rotational (body frame Euler)
  const I=derived.I, w=st.omega, T=f.torqueBody;
  const gyro=V3((I.z-I.y)*w.y*w.z,(I.x-I.z)*w.z*w.x,(I.y-I.x)*w.x*w.y);
  const aa=V3((T.x-gyro.x)/I.x,(T.y-gyro.y)/I.y,(T.z-gyro.z)/I.z);
  w.addScaledVector(aa, dt);
  w.multiplyScalar(0.998);   // mild blanket angular-rate damping
  // integrate quaternion from body angular velocity
  const wq=new THREE.Quaternion(w.x*dt*0.5, w.y*dt*0.5, w.z*dt*0.5, 1);
  st.quat.multiply(wq).normalize();
  // KINEMATIC ROLL LEVELER: a bird actively holds its wings level; model it as gently rotating the
  // body-up back toward world-up each step. This CANNOT diverge (it only ever pulls toward level),
  // so it robustly kills the slow sideslip-fed roll/Dutch-roll mode that the torque loop alone
  // leaves marginally stable at low flock speed -- without touching the flapping lift/thrust.
  if(P.stab>0){
    const fwd=_lvF.set(1,0,0).applyQuaternion(st.quat);
    const up =_lvU.set(0,1,0).applyQuaternion(st.quat);
    const dUp=_lvD.set(0,1,0).addScaledVector(fwd,-fwd.y);   // world-up made perpendicular to fwd
    if(dUp.lengthSq()>1e-6){
      dUp.normalize(); up.normalize();
      _lvQ.setFromUnitVectors(up, dUp);                       // full roll correction to level
      _lvI.identity().slerp(_lvQ, clamp(0.12*P.stab,0,0.5));  // apply a fraction each substep
      st.quat.premultiply(_lvI).normalize();
      st.omega.x *= 0.90;                                     // bleed roll rate to match
    }
  }
  // ground / water contact
  const minY=0.14;
  if(st.pos.y<minY){
    st.pos.y=minY;
    if(st.vel.y<0) st.vel.y*=-0.15;    // soft bounce off water
    st.vel.x*=0.995; st.vel.z*=0.995;
    st.landed=true;
  } else st.landed=false;
}

function fmt(v){ return Math.abs(v)>=100? v.toFixed(0) : Math.abs(v)>=10? v.toFixed(1): v.toFixed(3).replace(/0+$/,'').replace(/\.$/,''); }
function mkCtl(it){
  const div=document.createElement('div'); div.className='ctl';
  const lab=document.createElement('label');
  const name=document.createElement('span'); name.textContent=it.label;
  const val=document.createElement('b'); val.textContent=fmt(P[it.k])+(it.unit?(' '+it.unit):'');
  lab.appendChild(name); lab.appendChild(val); div.appendChild(lab);
  const inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step; inp.value=P[it.k];
  inp.addEventListener('input',()=>{
    P[it.k]=parseFloat(inp.value);
    val.textContent=fmt(P[it.k])+(it.unit?(' '+it.unit):'');
    recomputeDerived();
    if(it.k==='nBirds'){ resetState(); }   // add/remove birds -> rebuild the flock
    else if(['span','rootChord','taper','sweep','neckLen','tailArea','tailLen','innerFrac'].includes(it.k)) buildBird();

const SMV={};
function ema(k,v,a){ a=a||0.1; SMV[k]=(SMV[k]==null)?v:SMV[k]+(v-SMV[k])*a; return SMV[k]; }
