const chartCanvas=document.getElementById('chartCanvas'), cctx=chartCanvas.getContext('2d');
let chartData=[]; const CHART_N=240;
function drawChart(){
  const w=chartCanvas.width=chartCanvas.clientWidth*devicePixelRatio;
  const h=chartCanvas.height=chartCanvas.clientHeight*devicePixelRatio;
  cctx.clearRect(0,0,w,h);
  cctx.strokeStyle='#22303f'; cctx.lineWidth=1;
  for(let i=0;i<4;i++){const y=h*i/4; cctx.beginPath();cctx.moveTo(0,y);cctx.lineTo(w,y);cctx.stroke();}
  if(chartData.length<2) return;
  const W=P.mass*G;
  const maxF=Math.max(W*2.2, ...chartData.map(d=>Math.max(Math.abs(d.lift),Math.abs(d.thrust),W)));
  const maxA=Math.max(...chartData.map(d=>d.alt),5);
  const plot=(key,col,mx)=>{
    cctx.strokeStyle=col; cctx.lineWidth=2*devicePixelRatio; cctx.beginPath();
    chartData.forEach((d,i)=>{const x=w*i/(CHART_N-1); const y=h-(clamp(d[key],-mx,mx)/mx*0.5+0.5)*h;
      i?cctx.lineTo(x,y):cctx.moveTo(x,y);});
    cctx.stroke();
  };
  // weight line
  cctx.strokeStyle='#9aa7ff'; cctx.setLineDash([4,4]); cctx.lineWidth=1.5*devicePixelRatio;
  const wy=h-(W/maxF*0.5+0.5)*h; cctx.beginPath();cctx.moveTo(0,wy);cctx.lineTo(w,wy);cctx.stroke(); cctx.setLineDash([]);
  plot('lift','#4bd6c9',maxF);
  plot('thrust','#ffb454',maxF);
  // altitude on its own scale
  cctx.strokeStyle='#7fd1ff'; cctx.lineWidth=1.5*devicePixelRatio; cctx.beginPath();
  chartData.forEach((d,i)=>{const x=w*i/(CHART_N-1); const y=h-(d.alt/maxA)*h*0.96-2; i?cctx.lineTo(x,y):cctx.moveTo(x,y);});
  cctx.stroke();
}

/* ============================================================ CAMERA ======= */
// pov = -1: normal orbit/follow. pov = i>=0: ride bird i (a "bird's-eye view"), keys 1-9 pick the
// bird, 0 returns to orbit.
const cam={az:-2.3, el:0.28, dist:6.5, follow:true, target:V3(0,20,0), pov:-1, povYaw:0, povPitch:0};
const BASE_FOV=55, POV_FOV=82;
const povTagEl=document.getElementById('povTag'), leadTintEl=document.getElementById('leadTint');
const _pF=V3(), _pU=V3(), _pE=V3(), _wUp=V3(0,1,0), _pR=V3(), _pDir=V3();
const _qy=new THREE.Quaternion(), _qp=new THREE.Quaternion();
let dragging=false, px=0, py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{ if(!dragging)return; const dxp=e.clientX-px, dyp=e.clientY-py; px=e.clientX;py=e.clientY;
  if(cam.pov>=0){ // riding a bird: drag looks AROUND (yaw/pitch off the bird's heading)
    cam.povYaw   = clamp(cam.povYaw   - dxp*0.006, -2.7, 2.7);   // up to ~155deg each way -> see the whole flock
    cam.povPitch = clamp(cam.povPitch - dyp*0.006, -1.1, 1.1);
  } else { cam.az-=dxp*0.006; cam.el=clamp(cam.el+dyp*0.006,-1.3,1.3); }
});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault(); cam.dist=clamp(cam.dist*(1+Math.sign(e.deltaY)*0.1),1.5,120);},{passive:false});
// Scroll the water/grid/sky with the bird so the world is effectively infinite -- the
// bird never flies off the edge of the ground plane. The grid snaps to its cell size so
// its lines appear to stream past (a motion cue) instead of sliding with the bird.
function updateWorld(){
  if(!state) return;
  const p=state.pos;
  water.position.set(p.x, 0, p.z);
  waterMat.uniforms.uTime.value = performance.now()*0.001;   // roll the swell
  skyMesh.position.set(p.x, 0, p.z);
  terrainGroup.position.x = Math.round(p.x/TERR_PERIOD)*TERR_PERIOD;   // seamless endless coast
}
function updateCamera(){
  // ---- bird's-eye view: ride on the chosen bird's head; drag to look around at the rest of the flock ----
  if(cam.pov>=0 && birds[cam.pov]){
    const st=birds[cam.pov];
    const fwd=_pF.set(1,0,0).applyQuaternion(st.quat);
    const up =_pU.set(0,1,0).applyQuaternion(st.quat);
    // eye at the head (a touch forward of the COM and just above it)
    _pE.copy(st.pos).addScaledVector(fwd, Math.max(P.neckLen*1.15,0.22)).addScaledVector(up,0.05);
    camera.position.copy(_pE);
    up.lerp(_wUp,0.45).normalize(); camera.up.copy(up);   // keep horizon readable through banks
    // look direction = heading, turned by the drag-controlled yaw (about world-up) then pitch (about right)
    _pDir.copy(fwd);
    _qy.setFromAxisAngle(_wUp, cam.povYaw); _pDir.applyQuaternion(_qy);
    _pR.crossVectors(_pDir,_wUp).normalize();
    _qp.setFromAxisAngle(_pR, cam.povPitch); _pDir.applyQuaternion(_qp);
    camera.lookAt(_pE.x+_pDir.x*40, _pE.y+_pDir.y*40, _pE.z+_pDir.z*40);
    if(camera.fov!==POV_FOV){ camera.fov=POV_FOV; camera.updateProjectionMatrix(); }
    // which bird am I inhabiting? tag it, and tint the world blue when it's the lead
    const isLead = (cam.pov===order[0]);
    povTagEl.style.display='block';
    povTagEl.innerHTML = '🐦 Bird\'s-eye — riding bird #'+cam.pov+(isLead?' <b style="color:#5cb6ff">(LEAD)</b>':' (follower)')+' · drag to look · 0 to exit';
    leadTintEl.style.display = isLead ? 'block' : 'none';
    return;
  }
  povTagEl.style.display='none'; leadTintEl.style.display='none';
  // ---- orbit / chase ----
  if(camera.fov!==BASE_FOV){ camera.fov=BASE_FOV; camera.updateProjectionMatrix(); }
  camera.up.set(0,1,0);
  if(cam.follow && state) cam.target.lerp(state.pos, 0.22);   // tighter follow so fast flight stays framed
  const t=cam.target;
  camera.position.set(
    t.x+cam.dist*Math.cos(cam.el)*Math.cos(cam.az),
    t.y+cam.dist*Math.sin(cam.el),
    t.z+cam.dist*Math.cos(cam.el)*Math.sin(cam.az)
  );
  camera.lookAt(t);
}

/* ============================================================ MAIN LOOP ==== */
let telemetry={}, playing=true, lastT=performance.now();
function updateOneBird(st){
  const m=st.mesh; if(!m) return;
  m.root.position.copy(st.pos);
  m.root.quaternion.copy(st.quat);
  if(st.cmdRoll) m.root.rotateX(-st.cmdRoll);   // cosmetic lean into a lateral correction (physics stays wings-level)
  // flap at shoulder, fold at elbow, twist each segment -- matching the physics
  const be=st.beta+P.dihedral*DEG;
  m.wingR.rotation.x=-be; m.wingL.rotation.x=be;
  const gamma=(st.fold||0)*P.maxFoldDeg*DEG;
  m.wingRelbow.rotation.set(0, -gamma, 0);   // in-plane backsweep about the wing normal (like a real elbow)
  m.wingLelbow.rotation.set(0, +gamma, 0);   // left mirror
  const betaDotMax=Math.max(1e-3,P.flapAmp*DEG*2*Math.PI*Math.max(P.flapFreq,0.01));
  const frv=clamp(st.betaDot/betaDotMax,-1.4,1.4);
  const feath=(st.betaDot<0? P.featherAmp*DEG*frv : 0);
  const inTw=P.innerAoA*DEG+feath, outTw=P.outerAoA*DEG+feath;
  m.wingRin.rotation.z=inTw; m.wingLin.rotation.z=-inTw;
  m.wingRout.rotation.z=outTw; m.wingLout.rotation.z=-outTw;
  // wingtip primaries: base splay/lift (winglet), splaying more with tip spread / during coast
  const spread=clamp((P.tipSpread||0) + (st.tel.coasting?0.4:0), 0, 1);
  const setFea=(arr,sgn)=>arr&&arr.forEach(fg=>{ const frac=fg.userData.k/4;
    const fan=(0.10 + 0.75*spread)*(frac-0.35);          // splay: outer quills fan back
    const lift=(0.20 + 0.55*spread)*(0.4+0.6*frac);      // outer quills lifted more
    fg.rotation.set(-sgn*lift, -sgn*fan, 0);
  });
  setFea(m.wingRtips,+1); setFea(m.wingLtips,-1);
  m.tail.rotation.z=P.tailIncidence*DEG;
  // wingtip wake trails (each traces a shed vortex core)
  if(P.vTrail){
    const L2=P.span*(1-P.innerFrac);
    const tipR=V3(0,0,L2); m.wingRout.localToWorld(tipR); pushTrail(st.trailR, m.trailR, tipR);
    const tipL=V3(0,0,-L2); m.wingLout.localToWorld(tipL); pushTrail(st.trailL, m.trailL, tipL);
    m.trailR.visible=true; m.trailL.visible=true;
  } else if(m.trailR){ m.trailR.visible=false; m.trailL.visible=false; }
}
// Lead colouring: the current point bird is light blue in BODY AND WINGS. While a newly-promoted
// bird is still taking over the point (leadFlash>0) it FLASHES between white and blue, so you can
// see the hand-off in progress; once settled it's solid blue. Followers are the natural cream/tan.
const LEAD_BODY=0x5cb6ff, LEAD_W1=0x5cb6ff, LEAD_W2=0x3f97e6, FLASH=0xffffff;
const FOLL_BODY=0xe4dcc9, FOLL_W1=0xcfc3ad, FOLL_W2=0xbdb096;
const _colA=new THREE.Color(), _colB=new THREE.Color();
function mixInto(dst,a,b,t){ _colA.setHex(a); _colB.setHex(b); dst.copy(_colA).lerp(_colB,t); }
function updateLeadColors(dt){
  const leadArrIdx = order.length?order[0]:-1;
  const s = 0.5 + 0.5*Math.sin(performance.now()*0.001*2*Math.PI*3.5);   // 3.5 Hz flash
  for(let i=0;i<birds.length;i++){
    const st=birds[i], m=st.mesh; if(!m) continue;
    if(i===leadArrIdx){
      if((st.leadFlash||0)>0){
        st.leadFlash=Math.max(0,(st.leadFlash||0)-dt);
        mixInto(m.skin.color, FLASH, LEAD_BODY, s);
        if(m.wingMats){ mixInto(m.wingMats[0].color, FLASH, LEAD_W1, s); mixInto(m.wingMats[1].color, FLASH, LEAD_W2, s); }
      } else {
        m.skin.color.setHex(LEAD_BODY);
        if(m.wingMats){ m.wingMats[0].color.setHex(LEAD_W1); m.wingMats[1].color.setHex(LEAD_W2); }
      }
    } else {
      st.leadFlash=0;
      m.skin.color.setHex(FOLL_BODY);
      if(m.wingMats){ m.wingMats[0].color.setHex(FOLL_W1); m.wingMats[1].color.setHex(FOLL_W2); }
    }
  }
}
// ---- BIRD SHADOWS on the sea: the bird's ACTUAL polygons, flattened onto the water along the sun
// direction (a planar projection matrix), so the shadow is a real silhouette -- flapping wings and
// all -- not an oval. It sits UNDER the bird (birds' opaque bodies are drawn first, so the shadow is
// correctly occluded by the flock and never paints over a bird), and the sea writes no depth so wave
// crests can't hide it. The projection offset grows as a bird climbs, so height still reads at a glance.
const shadowGroup = new THREE.Group(); scene.add(shadowGroup);
const SHADOW_Y = 0.08;
const _shadowMatrix = (function(){
  const S=new THREE.Vector3(40,70,30);           // sun position; light travels along -S
  const kx=(-S.x)/(-S.y), kz=(-S.z)/(-S.y), H=SHADOW_Y;
  return new THREE.Matrix4().set(1,-kx,0,kx*H,  0,0,0,H,  0,-kz,1,kz*H,  0,0,0,1);
})();
const _shTmp=new THREE.Matrix4();
function buildShadows(){
  while(shadowGroup.children.length){ const m=shadowGroup.children.pop(); m.material.dispose(); } // geometry shared w/ birds
  for(const st of birds){
    const mat=new THREE.MeshBasicMaterial({color:0x5b6a73, transparent:true, opacity:0.3, depthWrite:false});
    st._shadowMat=mat; st._shadowPairs=[];
    st.mesh.root.traverse(o=>{
      if(o.isMesh && o.geometry && o.geometry.type!=='BoxGeometry'){   // skip the tiny primary-feather boxes
        const sh=new THREE.Mesh(o.geometry, mat);
        sh.matrixAutoUpdate=false; sh.renderOrder=-1; sh.frustumCulled=false;
        shadowGroup.add(sh); st._shadowPairs.push({src:o, sh});
      }
    });
  }
}
function updateShadows(){
  for(const st of birds){
    if(!st._shadowPairs) continue;
    // cast only over open water, and only while airborne
    const szc = st.pos.z - ((-30)/(-70))*(st.pos.y-SHADOW_Y);      // projected z of the bird
    const over = (szc < COAST_Z + coastLine(st.pos.x) - 1) && st.pos.y>0.15;
    st._shadowMat.opacity = over ? clamp(0.36 - st.pos.y*0.008, 0.08, 0.36) : 0;
    if(!over){ for(const p of st._shadowPairs) p.sh.visible=false; continue; }
    st.mesh.root.updateMatrixWorld(true);
    for(const p of st._shadowPairs){
      p.sh.visible = p.src.visible;
      p.sh.matrix.multiplyMatrices(_shadowMatrix, p.src.matrixWorld);   // flatten the polygons onto the sea
    }
  }
}
function updateBirdMesh(dt){
  for(let i=0;i<birds.length;i++){
    updateOneBird(birds[i]);
    // hide the bird we're riding so we don't stare into the back of its own head
    if(birds[i].mesh) birds[i].mesh.root.visible = (cam.pov!==i);
  }
  updateLeadColors(dt||0);
  updateShadows();
}
function updateFlow(dt){
  if(!flow||!P.vFlow){ if(flow)flow.visible=false; return;} flow.visible=true;
  const wind=windWorld(); const b=state.pos;
  for(let i=0;i<flowN;i++){
    // air moves at wind; relative to a mostly-forward-moving bird it streams backward
    flowPos[i*3]   += (wind.x)*dt;
    flowPos[i*3+1] += (wind.y)*dt;
    flowPos[i*3+2] += (wind.z)*dt;
    // recycle particles that fall behind or stray
    const dx=flowPos[i*3]-b.x, dz=flowPos[i*3+2]-b.z, dy=flowPos[i*3+1]-b.y;
    if(dx<-24||Math.abs(dz)>26||Math.abs(dy)>16||flowPos[i*3+1]<0.2) resetFlowParticle(i,false);
  }
  flow.geometry.attributes.position.needsUpdate=true;
}
function updateArrows(){
  const st=state, o=st.pos.clone();
  const scale=clamp(2.5/Math.max(P.mass*G,1),0.02,3);
  const fd=telemetry.flightDir||V3(1,0,0);
  setArrow(arrows.weight,o,V3(0,-P.mass*G,0),scale);
  setArrow(arrows.lift,o,V3(0,telemetry.lift||0,0),scale);
  setArrow(arrows.thrust,o,fd.clone().multiplyScalar(telemetry.thrust||0),scale*2.2);
  const dv=(telemetry.flightDir||V3(1,0,0)).clone().multiplyScalar(-(telemetry.dragScalar||0));
  setArrow(arrows.drag,o,dv,scale*2.2);
}
function updateHUD(){
  const st=state, wind=windWorld();
  const airspeed=V3().subVectors(st.vel,wind).length();
  const ld=(telemetry.dragScalar>0.01)? (telemetry.lift/telemetry.dragScalar):0;
  const aoaS=ema('aoa',telemetry.aoa*RAD), ldS=ema('ld',ld,0.06), pwrS=ema('pwr',telemetry.power||0,0.06);
  setStat('airspeed',fmt(airspeed)); setStat('alt',fmt(st.pos.y));
  setStat('vspeed',(st.vel.y>=0?'+':'')+fmt(st.vel.y)); setStat('aoa',fmt(aoaS));
  setStat('ld',ldS>0?fmt(ldS):'–'); setStat('power',fmt(pwrS));
  // fold + actual flap amplitude (RMS estimate: A = sqrt(2*mean(beta^2)))
  const bdeg=st.beta*RAD;
  SMV.bsq=ema('bsq',bdeg*bdeg,0.03);
  setStat('fold',fmt(telemetry.foldDeg||0));
  setStat('flapamp',fmt(Math.sqrt(2*Math.max(0,SMV.bsq))));
  setStat('gap', telemetry.gap==null?'–':fmt(telemetry.gap));
  setStat('duty', fmt(100*(state.flapDuty||0)));
  const role = (state.leaderIdx==null)?'LEAD':(state.side>0?'R':'L')+state.rank;
  setStat('upwash', (telemetry.upwash>=0?'+':'')+fmt(telemetry.upwash||0));
  setStat('bird', '#'+focus+' '+role);
  // flap / coast state badge
  const mb=document.getElementById('modeBadge');
  if(P.flapStrategy!=='intermittent'){ mb.textContent='FLAP'; mb.className='badge flap'; }
  else if(telemetry.coasting){ mb.textContent='COAST'; mb.className='badge coast'; }
  else { mb.textContent='FLAP'; mb.className='badge flap'; }
  const sk=document.getElementById('skimTag');
  if(sk){ if(skimState==='cruise') sk.textContent='';
    else { const lbl={descend:'Dropping to the surface',skim:'Skimming the surface in ground effect',ascend:'Climbing back to cruise'}[skimState];
      sk.innerHTML='<span style="color:#8fe9df">'+lbl+'</span> (lead stays until the dip completes). '; } }
  const W=P.mass*G;
  const setBar=(id,val,ref)=>{
    const f=document.getElementById('bar_'+id), v=document.getElementById('barv_'+id);
    const frac=clamp(val/ref,-1,1);
    f.style.width=Math.abs(frac)*50+'%';
    f.style.left=frac>=0?'50%':(50+frac*50)+'%';
    v.textContent=fmt(val)+' N';
  };
  setBar('lift',telemetry.lift||0,W*2);
  setBar('thrust',telemetry.thrust||0,W*2);
  setBar('drag',-(telemetry.dragScalar||0),W*2);
  setBar('weight',-W,W*2);
  const badge=document.getElementById('stallBadge');
  const stallS=ema('stall',telemetry.stalled||0,0.05);
  if(stallS>10){ badge.textContent='STALL'; badge.className='badge stall'; }
  else { badge.textContent='OK'; badge.className='badge ok'; }
  // hint
  const hint=document.getElementById('hudHint');
  let msg='';
  const geZone = P.groundEffect && st.pos.y < 2*P.span;
  if(st.landed) msg='<span class="flash">On the water.</span> ';
  else if(geZone) msg='<span class="flash">In ground effect — extra lift, less induced drag.</span> ';
  const ct=telemetry.cycThrust||0;
  const isFollower = state.leaderIdx!=null;
  if(birds.length>1 && isFollower){
    const up=telemetry.upwash||0;
    const draftTxt = up>0.05 ? ' Riding <span style="color:#8fe9df">+'+fmt(up)+' m/s upwash</span> off the bird ahead.'
                             : (P.draft? ' (out of the upwash — nudge slotDz to catch it)':'');
    if(telemetry.coasting) msg+='<span style="color:#9aa7ff">Coasting</span> in slot, '+fmt(telemetry.gap||0)+' m back.'+draftTxt;
    else msg+='<span style="color:var(--accent)">Flapping</span> to hold slot ('+fmt(telemetry.gap||0)+' m back).'+draftTxt;
  } else if(birds.length>1){
    msg+='<span style="color:#8fe9df">Lead bird</span> — setting the pace at '+fmt(P.paceSpeed)+' m/s. '
       +(P.leadRotate?'Peels off to the back every '+fmt(P.rotatePeriod)+' s.':'Lead rotation off.');
  } else if(P.flapStrategy==='intermittent' && telemetry.coasting){
    msg+='<span style="color:#9aa7ff">Coasting</span> — '+fmt(telemetry.gap||0)+' m behind the leader, gliding and bleeding speed. Beats again at '+fmt(P.followDist+P.draftBand)+' m.';
  } else if(P.flapStrategy==='intermittent'){
    msg+='<span style="color:var(--accent)">Flapping</span> to catch back up ('+fmt(telemetry.gap||0)+' m behind). Duty '+fmt(100*(state.flapDuty||0))+'%.';
  } else if(P.mode==='muscle' && (telemetry.effort||0)>0.99){
    msg+='<span class="flash">Muscles saturated — wingbeat falling short. Raise strength, fold more, or lighten the wings.</span>';
  } else if(ct<-0.6) msg+='Cycle-avg net thrust '+fmt(ct)+' N — decelerating. Flap harder/faster or add feather.';
  else if(ct>0.6) msg+='Cycle-avg net thrust +'+fmt(ct)+' N — accelerating from flapping.';
  else msg+='Cycle-avg net thrust ≈ '+fmt(ct)+' N — near cruise balance.';
  hint.innerHTML=msg;
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000; lastT=now; dt=clamp(dt,0,0.05)*P.timeScale;
  if(playing && dt>0){
    // fixed substeps for stability
    const sub=1/480; let acc=dt;
    let guard=0;
    while(acc>1e-6 && guard++<80){ const h=Math.min(sub,acc); integrate(h); acc-=h; }
    updateBirdMesh(dt); updateFlow(dt); updateArrows(); updateWindField();
    // strips visualization opacity
    // charts
    chartData.push({lift:telemetry.lift||0, thrust:telemetry.thrust||0, alt:state.pos.y});
    if(chartData.length>CHART_N) chartData.shift();
    updateHUD(); drawChart();
  }
  updateWorld();
  updateCamera();
  renderer.render(scene,camera);
}

/* ---------- controls wiring ---------- */
document.getElementById('btnPlay').onclick=e=>{playing=!playing; e.target.textContent=playing?'⏸ Pause':'▶ Play';};
document.getElementById('btnReset').onclick=()=>{resetState();};
function resetAll(){
  Object.assign(P, JSON.parse(JSON.stringify(DEFAULTS)));
  currentPreset='Pelican';
  buildUI();                 // rebuild panel so every slider, select, chip and toggle reflects defaults
  recomputeDerived(); buildBird(); resetState();
}
document.getElementById('btnResetAll').onclick=resetAll;
document.getElementById('btnFollow').onclick=e=>{cam.follow=!cam.follow; e.target.textContent='🎥 Follow: '+(cam.follow?'on':'off');};
function setFocus(i){ if(!birds.length) return; focus=(i+birds.length)%birds.length; state=birds[focus]; telemetry=state.tel; }
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();document.getElementById('btnPlay').click();}
  if(e.key==='r'||e.key==='R') resetState();
  if(e.key==='f'||e.key==='F') document.getElementById('btnFollow').click();
  if(e.key===']'||e.key==='.') setFocus(focus+1);       // cycle which bird the HUD/camera follows
  if(e.key==='['||e.key===',') setFocus(focus-1);
  // bird's-eye view: 1-9 ride that bird (look through its eyes), 0 returns to the orbit camera
  if(e.key>='1' && e.key<='9'){ const i=+e.key-1; if(i<birds.length){ cam.pov=i; cam.povYaw=0; cam.povPitch=0; setFocus(i); } }
  if(e.key==='0'){ cam.pov=-1; }
});
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

/* ---------- boot ---------- */
buildUI(); buildHUD(); buildFlow(); buildWindField(); resetState();
requestAnimationFrame(frame);

// expose for headless verification
window.__sim={P,
  get state(){return state;}, get telemetry(){return telemetry;},
  get birds(){return birds;}, get order(){return order;}, get focus(){return focus;}, set focus(i){setFocus(i);},
  get skimState(){return skimState;}, get flockBaseAlt(){return flockBaseAlt;},
  forceSkim(){ skimCountdown=0; },   // trigger a dip now (for testing)
  derived, integrate, stepFlock, stepBird, computeWakes, flockControl,
  resetState, resetFlock, computeForces, cam, buildBird};
</script>
