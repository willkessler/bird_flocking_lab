<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0b0f14; --panel:#121821e6; --panel2:#0e131a; --line:#223042;
    --ink:#dfe8f2; --dim:#8ea0b5; --accent:#4bd6c9; --accent2:#ffb454;
    --good:#5ad19a; --bad:#ff6b6b; --warn:#ffd166; --lift:#4bd6c9; --thrust:#ffb454; --drag:#ff6b6b; --weight:#9aa7ff;
    --ui:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #scene{position:absolute;inset:0}
  /* Panels */
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 10px 40px #0008}
  #controls{top:12px;left:12px;width:326px;max-height:calc(100% - 24px);overflow-y:auto;padding:0}
  #controls::-webkit-scrollbar{width:9px}
  #controls::-webkit-scrollbar-thumb{background:#2a3a4f;border-radius:8px}
  #hud{top:12px;right:12px;width:270px;padding:12px 14px}
  #charts{right:12px;bottom:12px;width:270px;padding:10px 12px}
  #toolbar{bottom:12px;left:12px;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 320px)}
  h1{font-size:14px;margin:0;padding:13px 14px 11px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  h1 small{color:var(--dim);font-weight:400;font-size:11px;margin-left:auto}
  details{border-bottom:1px solid var(--line)}
  details[open] > summary{color:var(--ink)}
  summary{cursor:pointer;list-style:none;padding:9px 14px;font-weight:600;color:var(--dim);user-select:none;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;font-size:11px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--accent);font-size:10px;transition:transform .15s}
  details[open] > summary::before{transform:rotate(90deg)}
  .sec{padding:4px 14px 12px}
  .ctl{margin:9px 0}
  .ctl label{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:3px;font-size:11.5px}
  .ctl label b{color:var(--ink);font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#243244;border-radius:3px;outline:none;margin:2px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px #4bd6c933}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
  select{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{flex:1;text-align:center;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--dim);cursor:pointer;font-weight:600;font-size:11.5px;transition:.12s}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip.on{background:linear-gradient(180deg,#183a3a,#12232a);border-color:var(--accent);color:var(--accent)}
  .btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);cursor:pointer;font-weight:600;font-size:12px;transition:.12s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(180deg,#1c4b47,#123230);border-color:var(--accent);color:var(--accent)}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--dim);cursor:pointer;font-size:11.5px;padding:3px 0}
  .toggle input{accent-color:var(--accent)}
  /* HUD */
  .hud-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:4px}
  .stat{display:flex;flex-direction:column}
  .stat .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:18px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.15}
  .stat .u{color:var(--dim);font-size:10px;font-weight:400}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bar{display:flex;align-items:center;gap:8px;font-size:11px}
  .bar .lab{width:52px;color:var(--dim)}
  .bar .track{flex:1;height:8px;background:#1a2432;border-radius:5px;overflow:hidden;position:relative}
  .bar .fill{position:absolute;top:0;bottom:0;left:50%;border-radius:5px}
  .bar .val{width:56px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .hint{color:var(--dim);font-size:10.5px;margin-top:9px;line-height:1.35}
  .badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;margin-left:6px}
  .badge.ok{background:#123a2c;color:var(--good)}
  .badge.stall{background:#3a1212;color:var(--bad)}
  #chartCanvas{width:100%;height:150px;display:block}
  .clab{display:flex;gap:12px;font-size:10px;color:var(--dim);margin-top:4px;flex-wrap:wrap}
  .clab i{width:9px;height:3px;display:inline-block;border-radius:2px;margin-right:4px;vertical-align:middle}
  .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;color:var(--dim);font-size:10.5px;background:#0b0f14aa;padding:4px 10px;border-radius:16px;border:1px solid var(--line)}
  .flash{color:var(--warn)}
  a{color:var(--accent)}
</style>

<div id="app">
  <div id="scene"></div>

  <div class="panel" id="controls">
    <h1><span class="dot"></span> Bird Flight Lab <small>blade-element</small></h1>
    <!-- sections injected here -->
    <div id="secHost"></div>
  </div>

  <div class="panel" id="hud">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:700">Flight state <span id="stallBadge" class="badge ok">OK</span></div>
    </div>
    <div class="hud-grid" id="statGrid"></div>
    <div class="bars" id="forceBars"></div>
    <div class="hint" id="hudHint"></div>
  </div>

  <div class="panel" id="charts">
    <div style="font-weight:700;margin-bottom:4px">Forces over time</div>
    <canvas id="chartCanvas"></canvas>
    <div class="clab">
      <span><i style="background:var(--lift)"></i>Lift</span>
      <span><i style="background:var(--thrust)"></i>Net thrust</span>
      <span><i style="background:var(--weight)"></i>Weight</span>
      <span><i style="background:#7fd1ff"></i>Altitude</span>
    </div>
  </div>

  <div class="panel" id="toolbar">
    <button class="btn primary" id="btnPlay">⏸ Pause</button>
    <button class="btn" id="btnReset">↺ Reset</button>
    <button class="btn" id="btnFollow">🎥 Follow: on</button>
    <span style="color:var(--dim);font-size:11px">drag to orbit · scroll to zoom</span>
  </div>

  <div class="tag">Bird flies +X. Wind, mass, wings, muscles & stabilizers are all live — retune and watch the physics respond.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   BIRD FLIGHT LAB
   A blade-element (strip-theory) flapping-flight simulator.

   Core idea: each wing is divided into spanwise strips. Every strip computes
   its own local relative airflow (bird motion + body rotation + flapping
   velocity + wind), its angle of attack, and its lift & drag. Because the
   downstroke plunges the wing DOWN, the local airflow arrives from below-and-
   front, which tilts each strip's LIFT vector FORWARD -> that forward
   component is THRUST. Thrust therefore EMERGES from the geometry of wing
   motion; it is not scripted. Feathering (wing twist per stroke phase) breaks
   the up/down symmetry so the cycle nets positive thrust. Set feathering to 0
   and thrust collapses -- exactly the classic failure mode.
   ============================================================================ */

const DEG = Math.PI/180, RAD = 180/Math.PI, G = 9.81;
const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);

/* ------------------------------------------------------------------ PARAMS */
const P = {
  // mass & skeleton
  mass:3.5, boneThickness:1.0, wingMassFrac:0.16, headMassFrac:0.12, tailMassFrac:0.05,
  neckLen:0.35, tailLen:0.42,
  // wing geometry (per wing)
  span:1.05, rootChord:0.30, taper:0.5, sweep:6, dihedral:6,
  innerFrac:0.42,          // fraction of half-span that is the inner (arm) segment
  innerAoA:8, outerAoA:3,  // geometric angle of attack of inner vs outer (hand) wing
  // stabilizers
  tailArea:0.070, tailIncidence:-3, angDamp:1.0, stab:0.9, trimPitch:2,
  // aero
  rho:1.225, clAlpha:5.8, stallDeg:15, cd0:0.02, inducedK:0.05,
  groundEffect:1, geStrength:1.0, bodyCd:0.5,
  // flapping / kinematics
  mode:'prescribed', flapFreq:2.6, flapAmp:35, upDownAsym:0.18, featherAmp:8,
  foldAmount:0.7, maxFoldDeg:72,   // wrist/elbow flex on the upstroke (0 = rigid wing)
  // muscle (dynamic mode)
  muscleStrength:1.2, momentArm:0.020, muscleOptBeta:-8, muscleWidth:60,
  vmax:30, elevatorFrac:0.55,
  // wind
  headwind:0, crosswind:0, updraft:0,
  // launch
  launchSpeed:13, launchAngle:0, startAlt:28,
  // sim
  timeScale:1.0,
  // viz toggles
  vForces:1, vFlow:1, vTrail:1
};

/* ------------------------------------------------------------------ PRESETS */
const PRESETS = {
  Swallow:{ mass:0.020, span:0.16, rootChord:0.045, taper:0.45, sweep:16, dihedral:4,
    innerFrac:0.38, innerAoA:9, outerAoA:4, foldAmount:0.8, maxFoldDeg:80,
    flapFreq:8.5, flapAmp:48, featherAmp:14, tailArea:0.006, tailLen:0.11,
    neckLen:0.06, launchSpeed:9, startAlt:20, wingMassFrac:0.12, headMassFrac:0.10 },
  Crow:{ mass:0.50, span:0.45, rootChord:0.13, taper:0.6, sweep:8, dihedral:5,
    innerFrac:0.42, innerAoA:8, outerAoA:3, foldAmount:0.75, maxFoldDeg:75,
    flapFreq:4.2, flapAmp:40, featherAmp:10, tailArea:0.024, tailLen:0.24,
    neckLen:0.14, launchSpeed:11, startAlt:25, wingMassFrac:0.15, headMassFrac:0.11 },
  Albatross:{ mass:9.0, span:1.62, rootChord:0.24, taper:0.42, sweep:3, dihedral:3,
    innerFrac:0.50, innerAoA:7, outerAoA:3, foldAmount:0.4, maxFoldDeg:55,
    flapFreq:2.4, flapAmp:34, featherAmp:5, tailArea:0.055, tailLen:0.40,
    neckLen:0.24, launchSpeed:17, startAlt:40, wingMassFrac:0.14, headMassFrac:0.12 },
  Pelican:{ mass:3.5, span:1.05, rootChord:0.30, taper:0.5, sweep:6, dihedral:6,
    innerFrac:0.42, innerAoA:8, outerAoA:3, foldAmount:0.7, maxFoldDeg:72,
    flapFreq:2.6, flapAmp:35, featherAmp:8, tailArea:0.070, tailLen:0.42,
    neckLen:0.35, launchSpeed:13, startAlt:28, wingMassFrac:0.16, headMassFrac:0.12 }
};
let currentPreset = 'Pelican';

/* ------------------------------------------------------------------ SCENE */
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc7e8);
scene.fog = new THREE.Fog(0x9fc7e8, 60, 340);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.05, 2000);

// lights
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x24405a, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.05);
sun.position.set(40,70,30); scene.add(sun);

// water plane
const waterGeo = new THREE.PlaneGeometry(4000,4000,1,1);
const waterMat = new THREE.MeshStandardMaterial({color:0x2f6a8f, metalness:0.35, roughness:0.55, transparent:true, opacity:0.96});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2; water.position.y = 0; scene.add(water);

// grid to read motion over water
const grid = new THREE.GridHelper(4000, 400, 0x3a7ba0, 0x2b5c7a);
grid.material.opacity = 0.35; grid.material.transparent = true; grid.position.y = 0.02; scene.add(grid);

// sky dome (simple gradient via large sphere backface)
const skyGeo = new THREE.SphereGeometry(1000,24,16);
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide,
  uniforms:{top:{value:new THREE.Color(0x2b5a8c)}, bot:{value:new THREE.Color(0xbfe0f2)}},
  vertexShader:`varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`varying float h; uniform vec3 top; uniform vec3 bot; void main(){ float t=clamp(h*0.5+0.5,0.0,1.0); gl_FragColor=vec4(mix(bot,top,pow(t,0.8)),1.0);}`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

/* ------------------------------------------------------------------ BIRD MESH */
let bird, wingL, wingR, wingLin, wingRin, wingLout, wingRout, wingLelbow, wingRelbow, tailMesh, headGroup;
const birdRoot = new THREE.Group(); scene.add(birdRoot);

function tri(a,b,c){ return [a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z]; }

// Build one wing segment spanning global span-fractions gf0..gf1. Local +z*sign starts
// at 0 (so an outer segment can be attached at the elbow joint). Chord & sweep follow
// the global planform so inner + outer read as one continuous wing when extended.
function buildWingSeg(sign, gf0, gf1){
  const n=5, verts=[];
  const push=(p)=>verts.push(p.x,p.y,p.z);
  for(let i=0;i<n;i++){
    const a=i/n, b=(i+1)/n;
    const gfa=lerp(gf0,gf1,a), gfb=lerp(gf0,gf1,b);
    const la=(gfa-gf0)*P.span, lb=(gfb-gf0)*P.span;   // local span position from segment root
    const ca=P.rootChord*(1-(1-P.taper)*gfa), cb=P.rootChord*(1-(1-P.taper)*gfb);
    const swa=-Math.tan(P.sweep*DEG)*(gfa*P.span), swb=-Math.tan(P.sweep*DEG)*(gfb*P.span);
    const LEa=V3(swa+ca*0.35,0,sign*la), TEa=V3(swa-ca*0.65,0,sign*la);
    const LEb=V3(swb+cb*0.35,0,sign*lb), TEb=V3(swb-cb*0.65,0,sign*lb);
    push(LEa);push(LEb);push(TEa); push(TEa);push(LEb);push(TEb);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.computeVertexNormals();
  return g;
}

function buildBird(){
  if(bird){ birdRoot.remove(bird); bird.traverse(o=>{o.geometry&&o.geometry.dispose();}); }
  bird = new THREE.Group();
  const bodyLen = clamp(P.rootChord*2.2, 0.12, 0.9);
  const bodyR = clamp(bodyLen*0.28, 0.03, 0.22);
  const skin = new THREE.MeshStandardMaterial({color:0xede6d6, roughness:0.8, metalness:0.0});
  const dark = new THREE.MeshStandardMaterial({color:0x6b5b47, roughness:0.85});
  const wingMat = new THREE.MeshStandardMaterial({color:0xcfc3ad, roughness:0.7, metalness:0.0, side:THREE.DoubleSide, transparent:true, opacity:0.94});

  // torso
  const torso = new THREE.Mesh(new THREE.SphereGeometry(1,20,14), skin);
  torso.scale.set(bodyLen, bodyR, bodyR*0.9); bird.add(torso);

  // head + neck + beak
  headGroup = new THREE.Group();
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(bodyR*0.4,bodyR*0.55,P.neckLen,10), skin);
  neck.rotation.z = Math.PI/2; neck.position.set(P.neckLen*0.5, bodyR*0.5,0); headGroup.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(bodyR*0.5,14,10), skin);
  head.position.set(P.neckLen, bodyR*0.85,0); headGroup.add(head);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(bodyR*0.18, P.neckLen*0.6, 10), dark);
  beak.rotation.z = -Math.PI/2; beak.position.set(P.neckLen+P.neckLen*0.32, bodyR*0.8,0); headGroup.add(beak);
  bird.add(headGroup);

  // tail
  const tg = new THREE.BufferGeometry();
  const tl = P.tailLen*0.9, tw = Math.sqrt(P.tailArea)*1.1;
  tg.setAttribute('position', new THREE.Float32BufferAttribute([
    -bodyLen*0.7,0,0,  -bodyLen*0.7-tl,0, tw*0.5,  -bodyLen*0.7-tl,0,-tw*0.5
  ],3));
  tg.computeVertexNormals();
  tailMesh = new THREE.Mesh(tg, wingMat); bird.add(tailMesh);

  // Articulated wings: shoulder group (flap) -> inner twist + mesh; elbow group (fold)
  //   -> outer twist + mesh. Two bones like a real bird: humerus + forearm/hand.
  const shoulderX = bodyLen*0.15, shoulderY = bodyR*0.55, shoulderZ = bodyR*0.7;
  const L1 = P.span*P.innerFrac;
  const wingMat2 = wingMat.clone(); wingMat2.color = new THREE.Color(0xbdb096); // outer slightly darker
  function mkWing(sign){
    const shoulder=new THREE.Group(); shoulder.position.set(shoulderX, shoulderY, sign*shoulderZ);
    const inner=new THREE.Group(); shoulder.add(inner);
    inner.add(new THREE.Mesh(buildWingSeg(sign,0,P.innerFrac), wingMat));
    const elbow=new THREE.Group(); elbow.position.set(0,0,sign*L1); shoulder.add(elbow);
    const outer=new THREE.Group(); elbow.add(outer);
    outer.add(new THREE.Mesh(buildWingSeg(sign,P.innerFrac,1), wingMat2));
    bird.add(shoulder);
    return {shoulder,inner,elbow,outer};
  }
  const R=mkWing(+1), Lw=mkWing(-1);
  wingR=R.shoulder; wingRin=R.inner; wingRelbow=R.elbow; wingRout=R.outer;
  wingL=Lw.shoulder; wingLin=Lw.inner; wingLelbow=Lw.elbow; wingLout=Lw.outer;

  birdRoot.add(bird);
}

/* --------------------------------------------------------- FORCE ARROWS */
const arrows = {};
function mkArrow(color){
  const a = new THREE.ArrowHelper(V3(0,1,0), V3(), 1, color, undefined, undefined);
  a.line.material.linewidth=3; scene.add(a); return a;
}
arrows.lift   = mkArrow(0x4bd6c9);
arrows.thrust = mkArrow(0xffb454);
arrows.drag   = mkArrow(0xff6b6b);
arrows.weight = mkArrow(0x9aa7ff);
function setArrow(a, origin, vec, scale){
  const len = vec.length()*scale;
  if(len < 1e-3 || !P.vForces){ a.visible=false; return; }
  a.visible=true; a.position.copy(origin);
  a.setDirection(vec.clone().normalize());
  a.setLength(clamp(len,0.05,60), Math.min(len*0.28,2.2), Math.min(len*0.16,1.2));
}

/* --------------------------------------------------------- WIND FLOW PARTICLES */
let flow, flowPos, flowN=900, flowVel=[];
function buildFlow(){
  if(flow) scene.remove(flow);
  const g=new THREE.BufferGeometry();
  flowPos=new Float32Array(flowN*3);
  for(let i=0;i<flowN;i++) resetFlowParticle(i,true);
  g.setAttribute('position', new THREE.Float32BufferAttribute(flowPos,3));
  const m=new THREE.PointsMaterial({color:0xdff3ff,size:0.12,transparent:true,opacity:0.5,depthWrite:false});
  flow=new THREE.Points(g,m); scene.add(flow);
}
function resetFlowParticle(i, anywhere){
  // spawn in a box ahead of / around the bird
  const b = state ? state.pos : V3(0,20,0);
  const x = b.x + (anywhere? (Math.random()*60-30) : (18+Math.random()*8));
  const y = b.y + (Math.random()*24-12);
  const z = b.z + (Math.random()*40-20);
  flowPos[i*3]=x; flowPos[i*3+1]=Math.max(0.3,y); flowPos[i*3+2]=z;
}

/* --------------------------------------------------------- TRAILS */
let trailL, trailR, trailPtsL=[], trailPtsR=[], TRAIL_MAX=160;
function buildTrails(){
  [trailL,trailR].forEach(t=>t&&scene.remove(t));
  const mk=c=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(TRAIL_MAX*3),3));
    return new THREE.Line(g,new THREE.LineBasicMaterial({color:c,transparent:true,opacity:0.5}));};
  trailL=mk(0x4bd6c9); trailR=mk(0xffb454); scene.add(trailL); scene.add(trailR); trailPtsL=[];trailPtsR=[];
}
function pushTrail(arr, line, p){
  arr.push(p.x,p.y,p.z); if(arr.length>TRAIL_MAX*3) arr.splice(0,3);
  const a=line.geometry.attributes.position.array;
  a.fill(0);
  for(let i=0;i<arr.length;i++) a[i]=arr[i];
  line.geometry.attributes.position.needsUpdate=true;
  line.geometry.setDrawRange(0, arr.length/3);
}

/* ============================================================ PHYSICS ===== */
let state, derived={};
const NS1 = 4, NS2 = 5; // blade-element strips: inner segment, outer segment (per wing)

function recomputeDerived(){
  const m=P.mass;
  const mWing = m*P.wingMassFrac*clamp(P.boneThickness,0.3,3);   // both wings
  const mHead = m*P.headMassFrac;
  const mTail = m*P.tailMassFrac;
  const mTorso = Math.max(0.01, m - mWing - mHead - mTail);
  // center of mass (fore-aft), origin at torso center
  const comX = (mHead*P.neckLen - mTail*P.tailLen)/m;
  derived.com = V3(comX, 0, 0);
  derived.mWing=mWing; derived.mHead=mHead; derived.mTail=mTail; derived.mTorso=mTorso;
  // inertia (diagonal, body frame). rods & point masses.
  const s2 = P.span*P.span;
  const boneI = clamp(P.boneThickness,0.3,3);
  const Ixx = (1/3)*mWing*s2 + mTorso*0.02;                          // roll (wings dominate)
  const Izz = mHead*P.neckLen*P.neckLen + mTail*P.tailLen*P.tailLen + mTorso*0.03 + 0.02*mWing; // pitch
  const Iyy = Ixx*0.4 + Izz;                                          // yaw
  derived.I = V3(Math.max(Ixx,1e-3), Math.max(Iyy,1e-3), Math.max(Izz,1e-3));
  // flap DOF inertia (both wings as rods about shoulder) * bone thickness
  derived.Iflap = Math.max(1e-4, (1/3)*mWing*s2*boneI);
  // wing area (sum inner + outer strips, matching the blade-element discretization)
  let A=0;
  for(let i=0;i<NS1;i++){ const gf=P.innerFrac*(i+0.5)/NS1; const c=P.rootChord*(1-(1-P.taper)*gf); A+=c*(P.innerFrac*P.span/NS1); }
  for(let j=0;j<NS2;j++){ const gf=P.innerFrac+(1-P.innerFrac)*(j+0.5)/NS2; const c=P.rootChord*(1-(1-P.taper)*gf); A+=c*((1-P.innerFrac)*P.span/NS2); }
  derived.wingArea = A*2;
  derived.AR = (2*P.span)*(2*P.span)/derived.wingArea;
  // body drag frontal area
  derived.bodyA = 0.010*Math.pow(m,0.66);
  // muscle Fmax auto-scaled so strength~1 sustains flap for this bird
  const w = 2*Math.PI*P.flapFreq;
  const demand = derived.Iflap*w*w*(P.flapAmp*DEG) + 0.5*P.rho*(P.launchSpeed*P.launchSpeed)*derived.wingArea*P.span*0.25;
  derived.Fmax = P.muscleStrength * (demand/Math.max(P.momentArm,0.003)) * 5.0;
}

function resetState(){
  recomputeDerived();
  const a=P.launchAngle*DEG;
  state = {
    pos:V3(0, P.startAlt, 0),
    vel:V3(Math.cos(a)*P.launchSpeed, Math.sin(a)*P.launchSpeed, 0),
    quat:new THREE.Quaternion(),
    omega:V3(0,0,0),
    beta:0, betaDot:0, phase:0, fold:0, t:0, landed:false
  };
  // small nose-up trim to match launch angle
  state.quat.setFromEuler(new THREE.Euler(0,0,a*0.4,'XYZ'));
  telemetry = {lift:0,thrust:0,drag:0,weight:P.mass*G,aoa:0,power:0,cyc:0,cycThrust:0};
  chartData.length=0; trailPtsL=[];trailPtsR=[];
}

function windWorld(){ return V3(-P.headwind, P.updraft, P.crosswind); }

// full-range lift/drag coefficients (blend linear -> flat plate past stall)
function aeroCoeffs(alpha){
  const aStall=P.stallDeg*DEG;
  const CLlin=P.clAlpha*alpha;
  const CLfp=1.9*Math.sin(2*alpha);
  let w=clamp(Math.abs(alpha)/(aStall*1.7),0,1); w=smooth(w);
  const CL=(1-w)*CLlin + w*CLfp;
  const CDlin=P.cd0 + P.inducedK*CLlin*CLlin;
  const CDfp=P.cd0 + 2.0*Math.sin(alpha)*Math.sin(alpha);
  const CD=(1-w)*CDlin + w*CDfp;
  return [CL,CD,w];
}

// Rodrigues rotation of v about unit axis k by angle th (returns new Vector3)
const _t1=V3(),_t2=V3();
function rot(v,k,th){
  const c=Math.cos(th), s=Math.sin(th);
  _t1.copy(k).cross(v);
  _t2.copy(k).multiplyScalar(k.dot(v)*(1-c));
  return V3(
    v.x*c + _t1.x*s + _t2.x,
    v.y*c + _t1.y*s + _t2.y,
    v.z*c + _t1.z*s + _t2.z
  );
}

// Commanded wingbeat: warped phase for down/up asymmetry. Returns beta and its 1st & 2nd
// derivatives w.r.t. phase (the 2nd is used by the muscle motor controller).
function flapKinematics(phase){
  const dwn = clamp(0.5 - P.upDownAsym*0.5, 0.15, 0.85);
  const ph = ((phase%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  let u, dudph;
  if(ph < 2*Math.PI*dwn){ u=(ph/(2*Math.PI*dwn))*Math.PI; dudph=Math.PI/(2*Math.PI*dwn); }
  else { u=Math.PI+((ph-2*Math.PI*dwn)/(2*Math.PI*(1-dwn)))*Math.PI; dudph=Math.PI/(2*Math.PI*(1-dwn)); }
  const amp=P.flapAmp*DEG;
  const beta   = amp*Math.cos(u);
  const dbeta  = -amp*Math.sin(u)*dudph;              // dβ/dphase
  const d2beta = -amp*Math.cos(u)*dudph*dudph;        // d²β/dphase²
  return [beta, dbeta, d2beta];
}

/* Compute all aerodynamic + muscle terms for the CURRENT state.
   Returns forces in WORLD, torque in BODY, generalized flap force, telemetry. */
const _q=new THREE.Quaternion(), _qi=new THREE.Quaternion(), _m=new THREE.Matrix4();
function computeForces(st){
  const R=_m.makeRotationFromQuaternion(st.quat);
  const inv=_qi.copy(st.quat).invert();
  const wind=windWorld();
  // air velocity relative to COM, in BODY frame
  const relAir=V3().subVectors(wind, st.vel).applyQuaternion(inv);

  const netFbody=V3(), torqueBody=V3();
  let Qaero=0, Qgrav=0;
  let sumLiftUp=0, sumFwd=0, sumDrag=0, aoaAcc=0, aoaN=0, stalled=0;

  const dih=P.dihedral*DEG;
  const gBody=V3(0,-G,0).applyQuaternion(inv);

  // ---- FEATHER: dynamic nose-down twist on the downstroke (destall -> more thrust) ----
  const betaDotMax = Math.max(1e-3, P.flapAmp*DEG * 2*Math.PI*Math.max(P.flapFreq,0.01));
  const fr = clamp(st.betaDot/betaDotMax, -1.4, 1.4);
  const feath = (st.betaDot < 0) ? (P.featherAmp*DEG)*fr : 0;   // radians, nose-down on downstroke

  // ---- WING FOLD: extend + stiffen on the downstroke, flex the elbow/wrist on the
  // upstroke. Folding shrinks the outer wing's span, area and (crucially) its flap
  // inertia, so raising the wing costs almost nothing -- the mechanism that makes real
  // flapping, and the muscle-driven mode, energetically viable. Scheduled from stroke
  // phase: ~0 through the downstroke, rising through the upstroke.
  const fold01 = clamp(-Math.sin(st.phase), 0, 1);
  const foldFrac = P.foldAmount * fold01;                       // 0..foldAmount
  const gamma = foldFrac * P.maxFoldDeg*DEG;                    // elbow flex angle (rad)
  const phaseDot = 2*Math.PI*Math.max(P.flapFreq,0.001);
  const inRange = (-Math.sin(st.phase) > 0) && (-Math.sin(st.phase) < 1);
  const gammaDot = inRange ? P.foldAmount*(-Math.cos(st.phase))*phaseDot*P.maxFoldDeg*DEG : 0;
  st.fold = foldFrac;
  telemetry.foldDeg = foldFrac*P.maxFoldDeg;
  const foldNorm = clamp(gamma/Math.max(P.maxFoldDeg*DEG,1e-3), 0, 1);

  const L1 = P.span*P.innerFrac;                                // inner (humerus) length
  let Iflap = 0;                                                // dynamic flap inertia (both wings)

  // one blade element. twistRad = geometric AoA (rad); dAaero for forces, dAmass for inertia/gravity.
  function addStrip(sign, s, p, rFromSh, vWing, twistRad, dAaero, dAmass){
    const rC = V3().subVectors(p, derived.com);
    const dpdb = V3().crossVectors(V3(-sign,0,0), rFromSh);     // d(pos)/d(flap angle): whole wing about shoulder x
    const mstrip = derived.mWing*dAmass/Math.max(derived.wingArea,1e-4);
    Iflap += mstrip*dpdb.lengthSq();
    Qgrav += gBody.dot(dpdb)*mstrip;
    let chord=V3(1,0,0), normal=V3().crossVectors(s,chord); if(normal.y<0) normal.negate(); normal.normalize();
    const tw=twistRad*sign;
    chord=rot(chord,s,tw); normal=rot(normal,s,tw);
    const vRot=V3().crossVectors(st.omega, rC);
    const vRel=V3().copy(relAir).sub(vRot).sub(vWing);
    const sp2=vRel.lengthSq();
    if(sp2<1e-6) return;
    const uc=vRel.dot(chord), un=vRel.dot(normal);
    const alpha=Math.atan2(un, -uc);
    let [CL,CD,w]=aeroCoeffs(alpha);
    if(w>0.55) stalled++;
    let geMul=1;
    if(P.groundEffect){
      const worldY=st.pos.y + p.clone().applyQuaternion(st.quat).y;
      const h=Math.max(0.02,worldY), hb=h/(2*P.span);
      const ge=(16*hb)*(16*hb)/(1+(16*hb)*(16*hb));
      geMul=1+P.geStrength*0.35*(1-ge)*Math.exp(-hb*2);
      CD=P.cd0+(CD-P.cd0)*(0.5+0.5*ge);
    }
    const q=0.5*P.rho*sp2;
    const L=q*dAaero*CL*geMul, D=q*dAaero*CD;
    let liftDir=V3().crossVectors(vRel,s); if(liftDir.lengthSq()<1e-9) return;
    liftDir.normalize(); if(liftDir.dot(normal)<0) liftDir.negate();
    const dragDir=V3().copy(vRel).normalize();
    const F=V3().addScaledVector(liftDir,L).addScaledVector(dragDir,D);
    netFbody.add(F);
    torqueBody.add(V3().crossVectors(rC,F));
    Qaero += F.dot(dpdb);
    sumLiftUp+=L; sumDrag+=D; aoaAcc+=alpha; aoaN++;
  }

  for(const sign of [+1,-1]){
    const be = st.beta + dih;
    const s1 = V3(0, Math.sin(be), sign*Math.cos(be));           // inner spanwise
    const shoulder = V3(P.rootChord*0.1, 0.02, sign*0.03);
    let n1 = V3().crossVectors(s1, V3(1,0,0)); if(n1.y<0) n1.negate(); n1.normalize();  // wing normal = fold axis
    const omega1 = V3(-sign*st.betaDot, 0, 0);                   // inner-segment angular velocity (flap)
    const elbow = shoulder.clone().addScaledVector(s1, L1);
    const s2 = rot(s1, n1, -sign*gamma);                         // outer spanwise (swept back by fold)
    const omegaFold = n1.clone().multiplyScalar(-sign*gammaDot); // fold angular velocity about wing normal
    const elbowVel = V3().crossVectors(omega1, V3().subVectors(elbow, shoulder));

    // INNER segment (rigid arm)
    for(let i=0;i<NS1;i++){
      const gf=P.innerFrac*(i+0.5)/NS1, r=gf*P.span;
      const c=P.rootChord*(1-(1-P.taper)*gf);
      const sw=-Math.tan(P.sweep*DEG)*r;
      const dA=c*(P.innerFrac*P.span/NS1);
      const p=V3(shoulder.x+sw+0.10*c, shoulder.y, shoulder.z).addScaledVector(s1, r);
      const rFromSh=V3().subVectors(p, shoulder);
      const vWing=V3().crossVectors(omega1, rFromSh);
      addStrip(sign, s1, p, rFromSh, vWing, P.innerAoA*DEG+feath, dA, dA);
    }
    // OUTER segment (hand-wing that folds on the upstroke)
    for(let j=0;j<NS2;j++){
      const gf=P.innerFrac+(1-P.innerFrac)*(j+0.5)/NS2, r2=(gf-P.innerFrac)*P.span;
      const c=P.rootChord*(1-(1-P.taper)*gf);
      const sw=-Math.tan(P.sweep*DEG)*(gf*P.span);
      const dA=c*((1-P.innerFrac)*P.span/NS2);
      const areaF=Math.max(1-0.45*foldNorm, 0.3);                // feather overlap reduces exposed area when folded
      const p=V3(elbow.x+sw+0.10*c, elbow.y, elbow.z).addScaledVector(s2, r2);
      const rFromSh=V3().subVectors(p, shoulder);
      const rFromEl=V3().subVectors(p, elbow);
      const vWing=V3().copy(elbowVel).add(V3().crossVectors(V3().addVectors(omega1, omegaFold), rFromEl));
      addStrip(sign, s2, p, rFromSh, vWing, P.outerAoA*DEG+feath, dA*areaF, dA);
    }
  }
  derived.IflapDyn = Math.max(1e-4, Iflap);

  // ---- TAIL (horizontal stabilizer) as a single strip at the rear ----
  {
    const rC=V3(-P.tailLen,0,0).sub(derived.com);
    const vRot=V3().crossVectors(st.omega,rC);
    const vRel=V3().copy(relAir).sub(vRot);
    const sp2=vRel.lengthSq();
    if(sp2>1e-6){
      const s=V3(0,0,1);
      let chord=V3(1,0,0), normal=V3(0,1,0);
      const th=P.tailIncidence*DEG;
      chord=rot(chord,s,th); normal=rot(normal,s,th);
      const uc=vRel.dot(chord), un=vRel.dot(normal);
      const alpha=Math.atan2(un,-uc);
      const [CL,CD]=aeroCoeffs(alpha);
      const q=0.5*P.rho*sp2;
      const L=q*P.tailArea*CL, D=q*P.tailArea*CD;
      let liftDir=V3().crossVectors(vRel,s).normalize(); if(liftDir.dot(normal)<0) liftDir.negate();
      const dragDir=V3().copy(vRel).normalize();
      const F=V3().addScaledVector(liftDir,L).addScaledVector(dragDir,D);
      netFbody.add(F); torqueBody.add(V3().crossVectors(rC,F));
      sumDrag+=D;
    }
  }

  // ---- convert aero force to world ----
  const aeroWorld=netFbody.clone().applyQuaternion(st.quat);

  // ---- body (fuselage) parasitic drag, world ----
  const vair=V3().subVectors(st.vel, wind); const spd=vair.length();
  const Fbd=V3();
  if(spd>1e-4) Fbd.copy(vair).multiplyScalar(-0.5*P.rho*P.bodyCd*derived.bodyA*spd);

  // ---- gravity ----
  const Fg=V3(0,-P.mass*G,0);

  const netWorld=V3().add(aeroWorld).add(Fbd).add(Fg);

  // ---- angular aerodynamic damping (airframe + feathers), body frame ----
  const qref=0.5*P.rho*Math.max(spd*spd, 4);
  const dampT=V3().copy(st.omega).multiplyScalar(-P.angDamp*qref*0.02*derived.wingArea*P.span);
  torqueBody.add(dampT);

  // ---- ACTIVE STABILIZATION: a bird's tail/head/wing reflexes (closed-loop).
  // Drives pitch toward a trim attitude and levels roll, with a yaw damper. At
  // stab=0 you get the raw open-loop dynamics (phugoid, upsets); turn it up to fly.
  if(P.stab>0){
    const fwd=V3(1,0,0).applyQuaternion(st.quat);
    const right=V3(0,0,1).applyQuaternion(st.quat);
    const pitchErr=fwd.y - Math.sin(P.trimPitch*DEG);   // nose elevation vs trim
    const rollErr=right.y;                               // starboard-wing rise (want 0)
    const wn=3.2, ze=0.9, g=P.stab;
    const aPitch=(-wn*wn*pitchErr - 2*ze*wn*st.omega.z)*g;
    const aRoll =(-wn*wn*rollErr  - 2*ze*wn*st.omega.x)*g;
    const aYaw  =(-2*ze*wn*st.omega.y)*g;
    torqueBody.z += derived.I.z*aPitch;
    torqueBody.x += derived.I.x*aRoll;
    torqueBody.y += derived.I.y*aYaw;
    telemetry.ctrlPitch = derived.I.z*aPitch;
  }

  // ---- world-frame force decomposition for readouts ----
  const flightDir=V3(vair.x,0,vair.z); const fdlen=flightDir.length();
  if(fdlen>1e-3) flightDir.multiplyScalar(1/fdlen); else flightDir.set(1,0,0);
  const up=V3(0,1,0);
  const liftN = aeroWorld.dot(up);                    // vertical aero force
  const fwdN  = aeroWorld.clone().sub(Fbd.clone().multiplyScalar(0)).dot(flightDir); // net aero along flight
  telemetry.lift = liftN;
  telemetry.thrust = aeroWorld.dot(flightDir) + Fbd.dot(flightDir); // net forward (aero+bodydrag)
  telemetry.dragScalar = sumDrag + spd*0.5*P.rho*P.bodyCd*derived.bodyA*spd;
  telemetry.aoa = aoaN? (aoaAcc/aoaN) : 0;
  telemetry.stalled = stalled;
  telemetry.aeroWorld = aeroWorld;
  telemetry.flightDir = flightDir;
  telemetry.Fg = Fg;

  return {netWorld, torqueBody, Qaero, Qgrav};
}

// Maximum torque the two flight muscles can deliver about the flap axis RIGHT NOW,
// as a function of muscle state. Depressor (pectoralis) pulls the wing DOWN, elevator
// (supracoracoideus) pulls it UP. Each is limited by strength, a length-tension curve
// (falls off away from optimal wing angle) and a Hill force-velocity curve (force drops
// the faster the muscle shortens; it can resist more while being stretched).
function muscleCapacity(st){
  const flDep=Math.exp(-Math.pow((st.beta*RAD - P.muscleOptBeta)/P.muscleWidth, 2));
  const flEle=Math.exp(-Math.pow((st.beta*RAD + P.muscleOptBeta)/P.muscleWidth, 2));
  const hill=v => v>=0 ? clamp((P.vmax - v)/(P.vmax + 3*v), 0, 1) : 1.4;  // concentric / eccentric
  const capDep=Math.max(0, derived.Fmax*P.momentArm*flDep*hill(-st.betaDot));
  const capEle=Math.max(0, derived.Fmax*P.momentArm*P.elevatorFrac*flEle*hill(st.betaDot));
  return {dep:capDep, ele:capEle};
}

function integrate(dt){
  const st=state;
  // ---- flap DOF ----
  if(P.mode==='prescribed'){
    const phaseDot=2*Math.PI*P.flapFreq;
    const [beta,dbeta]=flapKinematics(st.phase);
    st.beta=beta; st.betaDot=dbeta*phaseDot;
    st.phase += phaseDot*dt;
    const f=computeForces(st);
    stepBody(st,f,dt);
    telemetry.power = Math.abs((f.Qaero)*st.betaDot); // aerodynamic flap power
  } else {
    // MUSCLE-DRIVEN: the bird commands a wingbeat; the muscles try to follow it but can
    // only deliver up to their available torque. Enough strength (and a folded, low-load
    // upstroke) -> it tracks the command and flies. Too weak, wings too heavy/dense air,
    // or fold turned off -> the muscles saturate, the wingbeat falls short, and it sinks.
    const phaseDot=2*Math.PI*Math.max(P.flapFreq,0.001);
    const [bt,dbt,d2bt]=flapKinematics(st.phase);
    const btDot=dbt*phaseDot, btDDot=d2bt*phaseDot*phaseDot;
    const f=computeForces(st);
    const Ifl=derived.IflapDyn||derived.Iflap;
    const cDamp=0.02*Ifl*phaseDot;
    // torque needed to follow the commanded beat (feed-forward inverse dynamics + gentle tracking)
    const kp=Math.pow(0.6*phaseDot,2), kd=2*0.9*(0.6*phaseDot);
    const tauFF = Ifl*btDDot - f.Qaero - f.Qgrav + cDamp*btDot;
    const tauFB = Ifl*(kp*(bt-st.beta) + kd*(btDot-st.betaDot));
    const tauReq = tauFF + tauFB;
    const cap=muscleCapacity(st);
    const tauAct = clamp(tauReq, -cap.dep, cap.ele);   // depressor(−) / elevator(+) limits
    const betaDDot=(tauAct + f.Qaero + f.Qgrav - cDamp*st.betaDot)/Ifl;
    st.betaDot += betaDDot*dt; st.betaDot=clamp(st.betaDot,-60,60);
    st.beta += st.betaDot*dt; st.beta=clamp(st.beta,-80*DEG,80*DEG);
    st.phase += phaseDot*dt;
    stepBody(st,f,dt);
    telemetry.power=Math.abs(tauAct*st.betaDot);       // real muscle mechanical power
    const have=(tauReq<0?cap.dep:cap.ele);
    telemetry.effort = have>1e-6 ? clamp(Math.abs(tauReq)/have,0,2) : 2;   // >1 = saturated
  }
  // cycle-averaged net thrust (for verification / display)
  telemetry.cyc += dt;
  telemetry.cycThrust = 0.98*telemetry.cycThrust + 0.02*telemetry.thrust;
  st.t += dt;
}

function stepBody(st, f, dt){
  // translational
  const acc=f.netWorld.clone().multiplyScalar(1/P.mass);
  st.vel.addScaledVector(acc, dt);
  st.pos.addScaledVector(st.vel, dt);
  // rotational (body frame Euler)
  const I=derived.I, w=st.omega, T=f.torqueBody;
  const gyro=V3((I.z-I.y)*w.y*w.z,(I.x-I.z)*w.z*w.x,(I.y-I.x)*w.x*w.y);
  const aa=V3((T.x-gyro.x)/I.x,(T.y-gyro.y)/I.y,(T.z-gyro.z)/I.z);
  w.addScaledVector(aa, dt);
  w.multiplyScalar(0.999);
  // integrate quaternion from body angular velocity
  const wq=new THREE.Quaternion(w.x*dt*0.5, w.y*dt*0.5, w.z*dt*0.5, 1);
  st.quat.multiply(wq).normalize();
  // ground / water contact
  const minY=0.14;
  if(st.pos.y<minY){
    st.pos.y=minY;
    if(st.vel.y<0) st.vel.y*=-0.15;    // soft bounce off water
    st.vel.x*=0.995; st.vel.z*=0.995;
    st.landed=true;
  } else st.landed=false;
}

   {k:'upDownAsym',label:'Down/up asymmetry',min:-0.6,max:0.6,step:0.02,unit:''},
   {k:'foldAmount',label:'Upstroke wing fold',min:0,max:1,step:0.02,unit:'',hint:'flex the elbow on the upstroke. 0 = rigid wing (costly upstroke)'},
   {k:'maxFoldDeg',label:'Full-fold angle',min:0,max:110,step:2,unit:'°'},
   {k:'featherAmp',label:'Feather (pitch ∝ flap rate)',min:0,max:45,step:1,unit:'°',hint:'nose-down destall on downstroke — trades lift for thrust'},
 ]},
 {title:'Muscle model (dynamic mode)', open:false, items:[
   {k:'muscleStrength',label:'Muscle strength',min:0.2,max:3,step:0.05,unit:'×',hint:'too low and the muscles saturate — the wingbeat falls short and it sinks'},
   {k:'momentArm',label:'Attachment moment arm',min:0.005,max:0.06,step:0.001,unit:'m',hint:'lever arm of the muscle at the shoulder'},
   {k:'muscleOptBeta',label:'Optimal wing angle',min:-40,max:20,step:1,unit:'°',hint:'length-tension peak (most force here)'},
   {k:'muscleWidth',label:'Length-tension width',min:15,max:120,step:5,unit:'°'},
   {k:'vmax',label:'Force-velocity Vmax',min:6,max:70,step:1,unit:'rad/s',hint:'faster shortening = less force'},
   {k:'elevatorFrac',label:'Elevator/depressor ratio',min:0.2,max:1.2,step:0.05,unit:'',hint:'upstroke muscle is normally the weaker one'},
 ]},
 {title:'Stabilizers & control', open:false, items:[
   {k:'stab',label:'Active stabilization (reflex)',min:0,max:2,step:0.05,unit:'×',hint:'bird tail/head reflexes. 0 = raw open-loop (phugoid, upsets)'},
   {k:'trimPitch',label:'Trim pitch target',min:-6,max:12,step:0.5,unit:'°'},
   {k:'tailArea',label:'Tail area',min:0,max:0.15,step:0.002,unit:'m²'},
   {k:'tailIncidence',label:'Tail incidence',min:-10,max:10,step:0.5,unit:'°'},
   {k:'angDamp',label:'Passive airframe damping',min:0,max:3,step:0.05,unit:''},
   {k:'clAlpha',label:'Lift-curve slope',min:3,max:7,step:0.1,unit:'/rad'},
   {k:'stallDeg',label:'Stall angle',min:8,max:24,step:1,unit:'°'},
   {k:'cd0',label:'Profile drag',min:0.005,max:0.1,step:0.005,unit:''},
   {k:'bodyCd',label:'Body drag coeff',min:0.1,max:1.2,step:0.05,unit:''},
 ]},
 {title:'Wind & air', open:false, items:[
   {k:'headwind',label:'Headwind',min:-15,max:20,step:0.5,unit:'m/s',hint:'+ opposes flight, raises airspeed & lift'},
   {k:'crosswind',label:'Crosswind',min:-15,max:15,step:0.5,unit:'m/s'},
   {k:'updraft',label:'Updraft',min:-5,max:8,step:0.5,unit:'m/s'},
   {k:'rho',label:'Air density',min:0.6,max:1.4,step:0.02,unit:'kg/m³'},
   {k:'geStrength',label:'Ground-effect strength',min:0,max:2,step:0.05,unit:'×'},
 ]},
 {title:'Launch & sim', open:false, items:[
   {k:'launchSpeed',label:'Launch speed',min:0,max:30,step:0.5,unit:'m/s',reset:true},
   {k:'launchAngle',label:'Launch angle',min:-20,max:30,step:1,unit:'°',reset:true},
   {k:'startAlt',label:'Start altitude',min:0.5,max:80,step:0.5,unit:'m',reset:true},
   {k:'timeScale',label:'Time scale',min:0.1,max:2,step:0.05,unit:'×'},
 ]},
];

const secHost=document.getElementById('secHost');
function buildUI(){
  secHost.innerHTML='';
  for(const sec of SCHEMA){
    const d=document.createElement('details'); if(sec.open) d.open=true;
    const s=document.createElement('summary'); s.textContent=sec.title; d.appendChild(s);
    const body=document.createElement('div'); body.className='sec'; d.appendChild(body);
    if(sec.custom==='presets'){ buildPresetSection(body); }
    else for(const it of sec.items){ body.appendChild(mkCtl(it)); }
    secHost.appendChild(d);
  }
}
function fmt(v){ return Math.abs(v)>=100? v.toFixed(0) : Math.abs(v)>=10? v.toFixed(1): v.toFixed(3).replace(/0+$/,'').replace(/\.$/,''); }
function mkCtl(it){
  const div=document.createElement('div'); div.className='ctl';
  const lab=document.createElement('label');
  const name=document.createElement('span'); name.textContent=it.label;
  const val=document.createElement('b'); val.textContent=fmt(P[it.k])+(it.unit?(' '+it.unit):'');
  lab.appendChild(name); lab.appendChild(val); div.appendChild(lab);
  const inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step; inp.value=P[it.k];
  inp.addEventListener('input',()=>{
    P[it.k]=parseFloat(inp.value);
    val.textContent=fmt(P[it.k])+(it.unit?(' '+it.unit):'');
    recomputeDerived();
    if(['span','rootChord','taper','sweep','neckLen','tailArea','tailLen','innerFrac'].includes(it.k)) buildBird();
    if(it.reset){ /* launch params only take effect on reset */ }
    markPresetCustom();
  });
  inp.dataset.k=it.k; div.appendChild(inp);
  if(it.hint){ const h=document.createElement('div'); h.className='hint'; h.style.margin='2px 0 0'; h.textContent=it.hint; div.appendChild(h); }
  return div;
}
function buildPresetSection(host){
  const chips=document.createElement('div'); chips.className='chips'; chips.id='presetChips';
  for(const name of Object.keys(PRESETS)){
    const c=document.createElement('div'); c.className='chip'+(name===currentPreset?' on':''); c.textContent=name; c.dataset.p=name;
    c.onclick=()=>applyPreset(name); chips.appendChild(c);
  }
  host.appendChild(chips);

  const row=document.createElement('div'); row.className='row'; row.style.marginTop='10px';
  const modeWrap=document.createElement('div');
  const ml=document.createElement('label'); ml.className='ctl'; ml.style.margin='0';
  ml.innerHTML='<span style="color:var(--dim);font-size:11.5px">Propulsion mode</span>';
  const sel=document.createElement('select');
  sel.innerHTML='<option value="prescribed">Prescribed kinematics</option><option value="muscle">Dynamic muscle-driven</option>';
  sel.value=P.mode; sel.onchange=()=>{
    P.mode=sel.value;
    // starting the muscle oscillator cleanly (without moving the bird) so it engages
    if(P.mode==='muscle' && state){ state.phase=0; state.beta=0; state.betaDot=0; }
    recomputeDerived();
  };
  modeWrap.appendChild(ml); modeWrap.appendChild(sel); row.appendChild(modeWrap);
  host.appendChild(row);

  const tg=document.createElement('div'); tg.style.marginTop='10px';
  const toggles=[['vForces','Force vectors'],['vFlow','Airflow'],['vTrail','Wingtip trails']];
  for(const [k,lb] of toggles){
    const t=document.createElement('label'); t.className='toggle';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!P[k];
    cb.onchange=()=>{P[k]=cb.checked?1:0; if(k==='vFlow'&&flow) flow.visible=cb.checked; if(k==='vTrail'){trailL.visible=cb.checked;trailR.visible=cb.checked;}};
    t.appendChild(cb); t.appendChild(document.createTextNode(lb)); tg.appendChild(t);
  }
  host.appendChild(tg);
}
function markPresetCustom(){
  currentPreset='Custom';
  document.querySelectorAll('#presetChips .chip').forEach(c=>c.classList.remove('on'));
}
function applyPreset(name){
  currentPreset=name;
  P.headwind=0; P.crosswind=0; P.updraft=0;   // presets start from calm air
  Object.assign(P, PRESETS[name]);
  document.querySelectorAll('#presetChips .chip').forEach(c=>c.classList.toggle('on', c.dataset.p===name));
  // refresh sliders
  document.querySelectorAll('#secHost input[type=range]').forEach(inp=>{
    const k=inp.dataset.k; if(k in P){ inp.value=P[k]; const b=inp.parentElement.querySelector('b');
      const it=findItem(k); if(b) b.textContent=fmt(P[k])+(it&&it.unit?(' '+it.unit):''); }
  });
  recomputeDerived(); buildBird(); resetState();
}
function findItem(k){ for(const s of SCHEMA) if(s.items) for(const it of s.items) if(it.k===k) return it; return null; }

/* ---------- HUD ---------- */
const statGrid=document.getElementById('statGrid');
const STATS=[
  ['airspeed','Airspeed','m/s'],['alt','Altitude','m'],
  ['vspeed','Climb rate','m/s'],['aoa','Angle of attack','°'],
  ['ld','Glide ratio L/D',''],['power','Flap power','W'],
  ['fold','Wing fold','°'],['flapamp','Flap amplitude','°'],
];
function buildHUD(){
  statGrid.innerHTML='';
  for(const [id,k,u] of STATS){
    const d=document.createElement('div'); d.className='stat';
    d.innerHTML=`<span class="k">${k}</span><span class="v" id="st_${id}">–<span class="u"> ${u}</span></span>`;
    statGrid.appendChild(d);
  }
  const bars=document.getElementById('forceBars'); bars.innerHTML='';
  for(const [id,lab,col] of [['lift','Lift','var(--lift)'],['thrust','Thrust','var(--thrust)'],['drag','Drag','var(--drag)'],['weight','Weight','var(--weight)']]){
    const b=document.createElement('div'); b.className='bar';
    b.innerHTML=`<span class="lab">${lab}</span><span class="track"><span class="fill" id="bar_${id}" style="background:${col}"></span></span><span class="val" id="barv_${id}">–</span>`;
    bars.appendChild(b);
  }
}
function setStat(id,v){ const e=document.getElementById('st_'+id); if(e){ const u=e.querySelector('.u'); e.textContent=v; if(u) e.appendChild(u);} }
// light smoothing for jittery status readouts (forces oscillate every wingbeat)
const SMV={};
function ema(k,v,a){ a=a||0.1; SMV[k]=(SMV[k]==null)?v:SMV[k]+(v-SMV[k])*a; return SMV[k]; }

/* ---------- charts ---------- */
const chartCanvas=document.getElementById('chartCanvas'), cctx=chartCanvas.getContext('2d');
let chartData=[]; const CHART_N=240;
function drawChart(){
  const w=chartCanvas.width=chartCanvas.clientWidth*devicePixelRatio;
  const h=chartCanvas.height=chartCanvas.clientHeight*devicePixelRatio;
  cctx.clearRect(0,0,w,h);
  cctx.strokeStyle='#22303f'; cctx.lineWidth=1;
  for(let i=0;i<4;i++){const y=h*i/4; cctx.beginPath();cctx.moveTo(0,y);cctx.lineTo(w,y);cctx.stroke();}
  if(chartData.length<2) return;
  const W=P.mass*G;
  const maxF=Math.max(W*2.2, ...chartData.map(d=>Math.max(Math.abs(d.lift),Math.abs(d.thrust),W)));
  const maxA=Math.max(...chartData.map(d=>d.alt),5);
  const plot=(key,col,mx)=>{
    cctx.strokeStyle=col; cctx.lineWidth=2*devicePixelRatio; cctx.beginPath();
    chartData.forEach((d,i)=>{const x=w*i/(CHART_N-1); const y=h-(clamp(d[key],-mx,mx)/mx*0.5+0.5)*h;
      i?cctx.lineTo(x,y):cctx.moveTo(x,y);});
    cctx.stroke();
  };
  // weight line
  cctx.strokeStyle='#9aa7ff'; cctx.setLineDash([4,4]); cctx.lineWidth=1.5*devicePixelRatio;
  const wy=h-(W/maxF*0.5+0.5)*h; cctx.beginPath();cctx.moveTo(0,wy);cctx.lineTo(w,wy);cctx.stroke(); cctx.setLineDash([]);
  plot('lift','#4bd6c9',maxF);
  plot('thrust','#ffb454',maxF);
  // altitude on its own scale
  cctx.strokeStyle='#7fd1ff'; cctx.lineWidth=1.5*devicePixelRatio; cctx.beginPath();
  chartData.forEach((d,i)=>{const x=w*i/(CHART_N-1); const y=h-(d.alt/maxA)*h*0.96-2; i?cctx.lineTo(x,y):cctx.moveTo(x,y);});
  cctx.stroke();
}

/* ============================================================ CAMERA ======= */
const cam={az:-2.3, el:0.28, dist:6.5, follow:true, target:V3(0,20,0)};
let dragging=false, px=0, py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{ if(!dragging)return; cam.az-=(e.clientX-px)*0.006; cam.el=clamp(cam.el+(e.clientY-py)*0.006,-1.3,1.3); px=e.clientX;py=e.clientY;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault(); cam.dist=clamp(cam.dist*(1+Math.sign(e.deltaY)*0.1),1.5,120);},{passive:false});
function updateCamera(){
  if(cam.follow && state) cam.target.lerp(state.pos, 0.12);
  const t=cam.target;
  camera.position.set(
    t.x+cam.dist*Math.cos(cam.el)*Math.cos(cam.az),
    t.y+cam.dist*Math.sin(cam.el),
    t.z+cam.dist*Math.cos(cam.el)*Math.sin(cam.az)
  );
  camera.lookAt(t);
}

/* ============================================================ MAIN LOOP ==== */
let telemetry={}, playing=true, lastT=performance.now();
function updateBirdMesh(){
  const st=state;
  birdRoot.position.copy(st.pos);
  birdRoot.quaternion.copy(st.quat);
  // flap at shoulder, fold at elbow, twist each segment -- matching the physics
  const be=st.beta+P.dihedral*DEG;
  wingR.rotation.x=-be; wingL.rotation.x=be;
  const gamma=(st.fold||0)*P.maxFoldDeg*DEG;
  wingRelbow.rotation.y=-gamma; wingLelbow.rotation.y=+gamma;
  const betaDotMax=Math.max(1e-3,P.flapAmp*DEG*2*Math.PI*Math.max(P.flapFreq,0.01));
  const frv=clamp(st.betaDot/betaDotMax,-1.4,1.4);
  const feath=(st.betaDot<0? P.featherAmp*DEG*frv : 0);
  const inTw=P.innerAoA*DEG+feath, outTw=P.outerAoA*DEG+feath;
  wingRin.rotation.z=inTw; wingLin.rotation.z=-inTw;
  wingRout.rotation.z=outTw; wingLout.rotation.z=-outTw;
  tailMesh.rotation.z=P.tailIncidence*DEG;
  if(P.vTrail){
    const L2=P.span*(1-P.innerFrac);
    const tipR=V3(0,0,L2); wingRout.localToWorld(tipR); pushTrail(trailPtsR,trailR,tipR);
    const tipL=V3(0,0,-L2); wingLout.localToWorld(tipL); pushTrail(trailPtsL,trailL,tipL);
  }
}
function updateFlow(dt){
  if(!flow||!P.vFlow){ if(flow)flow.visible=false; return;} flow.visible=true;
  const wind=windWorld(); const b=state.pos;
  for(let i=0;i<flowN;i++){
    // air moves at wind; relative to a mostly-forward-moving bird it streams backward
    flowPos[i*3]   += (wind.x)*dt;
    flowPos[i*3+1] += (wind.y)*dt;
    flowPos[i*3+2] += (wind.z)*dt;
    // recycle particles that fall behind or stray
    const dx=flowPos[i*3]-b.x, dz=flowPos[i*3+2]-b.z, dy=flowPos[i*3+1]-b.y;
    if(dx<-24||Math.abs(dz)>26||Math.abs(dy)>16||flowPos[i*3+1]<0.2) resetFlowParticle(i,false);
  }
  flow.geometry.attributes.position.needsUpdate=true;
}
function updateArrows(){
  const st=state, o=st.pos.clone();
  const scale=clamp(2.5/Math.max(P.mass*G,1),0.02,3);
  const fd=telemetry.flightDir||V3(1,0,0);
  setArrow(arrows.weight,o,V3(0,-P.mass*G,0),scale);
  setArrow(arrows.lift,o,V3(0,telemetry.lift||0,0),scale);
  setArrow(arrows.thrust,o,fd.clone().multiplyScalar(telemetry.thrust||0),scale*2.2);
  const dv=(telemetry.flightDir||V3(1,0,0)).clone().multiplyScalar(-(telemetry.dragScalar||0));
  setArrow(arrows.drag,o,dv,scale*2.2);
}
function updateHUD(){
  const st=state, wind=windWorld();
  const airspeed=V3().subVectors(st.vel,wind).length();
  const ld=(telemetry.dragScalar>0.01)? (telemetry.lift/telemetry.dragScalar):0;
  const aoaS=ema('aoa',telemetry.aoa*RAD), ldS=ema('ld',ld,0.06), pwrS=ema('pwr',telemetry.power||0,0.06);
  setStat('airspeed',fmt(airspeed)); setStat('alt',fmt(st.pos.y));
  setStat('vspeed',(st.vel.y>=0?'+':'')+fmt(st.vel.y)); setStat('aoa',fmt(aoaS));
  setStat('ld',ldS>0?fmt(ldS):'–'); setStat('power',fmt(pwrS));
  // fold + actual flap amplitude (RMS estimate: A = sqrt(2*mean(beta^2)))
  const bdeg=st.beta*RAD;
  SMV.bsq=ema('bsq',bdeg*bdeg,0.03);
  setStat('fold',fmt(telemetry.foldDeg||0));
  setStat('flapamp',fmt(Math.sqrt(2*Math.max(0,SMV.bsq))));
  const W=P.mass*G;
  const setBar=(id,val,ref)=>{
    const f=document.getElementById('bar_'+id), v=document.getElementById('barv_'+id);
    const frac=clamp(val/ref,-1,1);
    f.style.width=Math.abs(frac)*50+'%';
    f.style.left=frac>=0?'50%':(50+frac*50)+'%';
    v.textContent=fmt(val)+' N';
  };
  setBar('lift',telemetry.lift||0,W*2);
  setBar('thrust',telemetry.thrust||0,W*2);
  setBar('drag',-(telemetry.dragScalar||0),W*2);
  setBar('weight',-W,W*2);
  const badge=document.getElementById('stallBadge');
  const stallS=ema('stall',telemetry.stalled||0,0.05);
  if(stallS>10){ badge.textContent='STALL'; badge.className='badge stall'; }
  else { badge.textContent='OK'; badge.className='badge ok'; }
  // hint
  const hint=document.getElementById('hudHint');
  let msg='';
  const geZone = P.groundEffect && st.pos.y < 2*P.span;
  if(st.landed) msg='<span class="flash">On the water.</span> ';
  else if(geZone) msg='<span class="flash">In ground effect — extra lift, less induced drag.</span> ';
  const ct=telemetry.cycThrust||0;
  if(P.mode==='muscle' && (telemetry.effort||0)>0.99){
    msg+='<span class="flash">Muscles saturated — wingbeat falling short. Raise strength, fold more, or lighten the wings.</span>';
  } else if(ct<-0.6) msg+='Cycle-avg net thrust '+fmt(ct)+' N — decelerating. Flap harder/faster or add feather.';
  else if(ct>0.6) msg+='Cycle-avg net thrust +'+fmt(ct)+' N — accelerating from flapping.';
  else msg+='Cycle-avg net thrust ≈ '+fmt(ct)+' N — near cruise balance.';
  hint.innerHTML=msg;
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000; lastT=now; dt=clamp(dt,0,0.05)*P.timeScale;
  if(playing && dt>0){
    // fixed substeps for stability
    const sub=1/480; let acc=dt;
    let guard=0;
    while(acc>1e-6 && guard++<80){ const h=Math.min(sub,acc); integrate(h); acc-=h; }
    updateBirdMesh(); updateFlow(dt); updateArrows();
    // strips visualization opacity
    // charts
    chartData.push({lift:telemetry.lift||0, thrust:telemetry.thrust||0, alt:state.pos.y});
    if(chartData.length>CHART_N) chartData.shift();
    updateHUD(); drawChart();
  }
  updateCamera();
  renderer.render(scene,camera);
}

/* ---------- controls wiring ---------- */
document.getElementById('btnPlay').onclick=e=>{playing=!playing; e.target.textContent=playing?'⏸ Pause':'▶ Play';};
document.getElementById('btnReset').onclick=()=>{resetState();};
document.getElementById('btnFollow').onclick=e=>{cam.follow=!cam.follow; e.target.textContent='🎥 Follow: '+(cam.follow?'on':'off');};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();document.getElementById('btnPlay').click();}
  if(e.key==='r'||e.key==='R') resetState();
  if(e.key==='f'||e.key==='F') document.getElementById('btnFollow').click();
});
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

/* ---------- boot ---------- */
buildUI(); buildHUD(); buildBird(); buildFlow(); buildTrails(); resetState();
requestAnimationFrame(frame);

// expose for headless verification
window.__sim={P,get state(){return state;},get telemetry(){return telemetry;},derived,integrate,resetState,computeForces};
</script>
